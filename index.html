<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f5f7">
<title>AUREKA — Universal Quality Logbook Engine v2</title>
<style>
:root{
  --bg:#f5f5f7;--ink:#1d1d1f;--muted:#707078;--line:#00000012;--glass:#ffffffcc;
  --blue:#0071e3;--green:#34c759;--red:#ff3b30;--orange:#ff9f0a;--purple:#7046c5;
  --mint:#dff7ee;--mint2:#bfeee0;--deep:#0d5f4a;--shadow:0 18px 55px #00000010
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;color:var(--ink);
background:
radial-gradient(circle at 5% -10%,#fff 0,transparent 28%),
radial-gradient(circle at 92% -5%,#e8edff 0,transparent 29%),
radial-gradient(circle at 48% 12%,#e9fff8 0,transparent 36%),
var(--bg)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 18px;background:#f5f5f7da;backdrop-filter:blur(24px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#fff,#dff7ee);display:grid;place-items:center;border:1px solid #ffffff;box-shadow:0 10px 30px #0000000b}
.logoMark{width:22px;height:22px;border-radius:8px;background:linear-gradient(135deg,#30c978,#6edbc1 55%,#667de9);position:relative;box-shadow:0 6px 15px #32c97935}
.logoMark:after{content:"";position:absolute;inset:5px;border-radius:5px;border:2px solid #ffffffb9}
.brand b{font-size:16px;letter-spacing:-.02em}.brand small{display:block;color:var(--muted);font-size:9px}
.topActions{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:13px;padding:10px 14px;font-weight:700;background:var(--blue);color:#fff;box-shadow:0 8px 20px #0071e31d}
.btn.secondary{background:#00000008;color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.btn.glass{background:#ffffff94;color:var(--ink);box-shadow:none;border:1px solid #fff;backdrop-filter:blur(12px)}
.btn.danger{background:#ff3b3010;color:#b4231b;box-shadow:none}
.shell{display:grid;grid-template-columns:255px 1fr;min-height:calc(100vh - 65px)}
.side{position:sticky;top:65px;height:calc(100vh - 65px);padding:15px 12px;background:#f5f5f7b8;backdrop-filter:blur(25px);border-right:1px solid var(--line);overflow:auto}
.side .brand{padding:0 8px 18px}
.navTitle{font-size:8px;color:#999;text-transform:uppercase;letter-spacing:.13em;padding:11px 9px 5px}
.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:12px;font-size:11px;color:var(--ink)}
.nav button:hover,.nav button.active{background:linear-gradient(135deg,#e8f8f2,#e9edff);color:var(--deep);font-weight:800;box-shadow:0 8px 22px #2aa77b10}
.ico{display:inline-grid;place-items:center;width:23px}
.workspace{padding:22px 24px;min-width:0}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:15px}
.head h1{margin:0;font-size:29px;letter-spacing:-.05em}.head p{margin:5px 0;color:var(--muted);font-size:11px;line-height:1.5}
.pill,.tag{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;background:#00000008;color:#5b5b63;font-size:9px}
.tag{border-radius:8px;background:#eef0f5}
.grid{display:grid;gap:13px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--glass);border:1px solid #ffffff;border-radius:20px;padding:17px;box-shadow:var(--shadow);backdrop-filter:blur(20px)}
.label{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.value{font-size:30px;font-weight:850;margin-top:7px;letter-spacing:-.04em}
.sub{color:var(--muted);font-size:10px;line-height:1.55}
.section{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}.section h2{font-size:17px;margin:0}.section p{margin:2px 0 0;color:var(--muted);font-size:10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}.toolbar>*{min-width:160px;flex:1}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid #d9dae1;border-radius:11px;background:#ffffffdf;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:#78b8ff;box-shadow:0 0 0 4px #0071e312}
.tableWrap{overflow:auto;border-radius:17px;border:1px solid var(--line);background:#fffffff0}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:780px;font-size:10px}
th,td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{position:sticky;top:0;z-index:3;background:#f9fafbeF;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.05em}
tr:last-child td{border-bottom:none}
.kpi{padding:14px;border-radius:16px;background:linear-gradient(135deg,#ffffffd9,#e9fff65c);border:1px solid #fff}
.kpi .num{font-size:25px;font-weight:850}.good{color:#1b7d3d}.bad{color:#b4231b}.warn{color:#8a5700}
.progress{height:8px;border-radius:99px;background:#e8e8ed;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#36c976,#65d6c7 58%,#6b7be6);border-radius:99px}
.notice{padding:12px 14px;border-radius:14px;font-size:10px;line-height:1.55}.notice.good{background:#34c75913}.notice.warn{background:#ff9f0a13}.notice.bad{background:#ff3b3013}
.modelCard{padding:15px;border-radius:18px;background:linear-gradient(135deg,#ffffffc9,#e9fff69e);border:1px solid #ffffff}
.modelTitle{display:flex;align-items:center;justify-content:space-between;gap:8px}.modelTitle strong{font-size:12px}
.modelIcon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#e4f9f0,#e8edff)}
.list{display:flex;flex-direction:column;gap:7px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 11px;border:1px solid var(--line);border-radius:12px;background:#ffffff95}
.muted{color:var(--muted)}
.matrixWrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff}.matrix{border-collapse:separate;border-spacing:0;min-width:1150px}
.matrix th,.matrix td{padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
.matrix th{position:sticky;top:0;background:#f8fafaf2}.matrix .sticky1{position:sticky;left:0;z-index:5;background:#fafbfdf4}.matrix .sticky2{position:sticky;left:155px;z-index:5;background:#fafbfdf4}
.matrix input{border:0;background:transparent;padding:5px 4px;min-width:52px}
.cellGood{background:#34c75912}.cellWarn{background:#ff9f0a12}
.detail{border:1px solid var(--line);border-radius:14px;background:#ffffffa8;padding:12px}
.indList{display:flex;flex-direction:column;gap:6px}
.indItem{padding:10px;border:1px solid var(--line);border-radius:13px;background:#ffffffb5}
.indTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.indTop strong{font-size:11px}.indMeta{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap}.indActions{display:flex;gap:6px;flex-shrink:0}
.small{font-size:9px}.statusDot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--green)}
.empty{text-align:center;padding:36px;color:var(--muted);font-size:11px}
.modalBack{position:fixed;inset:0;z-index:100;background:#0000003c;backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:16px}
.modalBack.open{display:flex}.modal{width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:24px;background:#ffffffea;border:1px solid #fff;box-shadow:0 40px 100px #00000028;padding:18px}
.modalHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.modalHead h2{margin:0;font-size:20px}.field{margin:10px 0}.field label{display:block;font-size:9px;color:var(--muted);margin-bottom:5px}.fieldGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.footerNote{margin-top:15px;color:#8a8a92;font-size:9px}
.mobileBtn{display:none}
@media(max-width:1050px){.shell{grid-template-columns:220px 1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:750px){.mobileBtn{display:block}.shell{grid-template-columns:1fr}.side{position:fixed;left:-280px;width:265px;z-index:60}.side.open{left:0}.workspace{padding:17px 13px}.g4,.g3,.g2,.fieldGrid{grid-template-columns:1fr}.head{flex-direction:column}.topActions .btn.secondary{display:none}}
</style>
</head>

function qUnit(name){return state.profile.filter(x=>x.unit===name && x.active!==false)}
function unitMode(name){
  if(UNIT_MODE_OVERRIDES[name])return UNIT_MODE_OVERRIDES[name];
  const inds=qUnit(name);
  const models=[...new Set(inds.map(x=>x.model))];
  if(models.length===1)return models[0];
  return models.includes('patient_episode')?'patient_episode':models[0]||'activity_metric';
}

 <div class="field"><label>Kode</label><input id="p_code" value="${esc(x.code)}" placeholder="2026.XX" ${ind?'readonly':''}></div>
 <div class="field"><label>Unit</label><select id="p_unit">${MASTER.units.map(u=>`<option ${u.name===x.unit?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>
 <div class="field" style="grid-column:1/-1"><label>Judul indikator</label><input id="p_title" value="${esc(x.title)}"></div>
 <div class="field"><label>Jenis</label><input id="p_type" value="${esc(x.type)}"></div>
 <div class="field"><label>Target</label><input id="p_target" value="${esc(x.target||'')}"></div>
 <div class="field"><label>Numerator</label><textarea id="p_num" rows="3">${esc(x.numerator||'')}</textarea></div>
 <div class="field"><label>Denominator</label><textarea id="p_den" rows="3">${esc(x.denominator||'')}</textarea></div>
 <div class="field"><label>Model pengukuran</label><select id="p_model">${['patient_episode','provider_day','daily_metric','event_metric','activity_metric','aggregate_metric'].map(m=>`<option ${x.model===m?'selected':''}>${m}</option>`).join('')}</select></div>
 <div class="field"><label>Status</label><select id="p_active"><option value="true" ${x.active!==false?'selected':''}>Aktif</option><option value="false" ${x.active===false?'selected':''}>Nonaktif / Arsip profil</option></select></div>
 </div>
 <div class="notice good">Perubahan hanya memengaruhi konfigurasi profile di browser prototype ini. Dalam implementasi produksi, master akan berada di Settings + versioned database.</div>
 <div class="toolbar" style="margin-top:12px"><button class="btn secondary" onclick="closeModal()">Batal</button><button class="btn" onclick="saveIndicator('${esc(ind?.code||'')}')">Simpan Profil</button></div>`;
}
function editIndicator(code){const ind=state.profile.find(x=>x.code===code);openModal(indicatorForm(ind))}
function newIndicator(){openModal(indicatorForm())}
function saveIndicator(oldCode){
 const data={code:document.getElementById('p_code').value.trim(),unit:document.getElementById('p_unit').value,title:document.getElementById('p_title').value.trim(),type:document.getElementById('p_type').value.trim(),target:document.getElementById('p_target').value.trim(),numerator:document.getElementById('p_num').value.trim(),denominator:document.getElementById('p_den').value.trim(),model:document.getElementById('p_model').value,active:document.getElementById('p_active').value==='true'};
 if(!data.code||!data.title){toast('Kode dan judul wajib diisi');return}
 if(oldCode){const idx=state.profile.findIndex(x=>x.code===oldCode);if(idx>=0)state.profile[idx]={...state.profile[idx],...data}}
 else {if(state.profile.some(x=>x.code===data.code)){toast('Kode sudah ada');return};state.profile.push({...data,section:0})}
 saveProfile();closeModal();render();toast('Profil indikator diperbarui')}
function openModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalBack').classList.add('open')}
function closeModal(e){if(!e||e.target===document.getElementById('modalBack'))document.getElementById('modalBack').classList.remove('open')}
function filterTable(){const s=(document.getElementById('filterLog').value||'').toLowerCase();document.querySelectorAll('#logTable tbody tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(s)?'':'none')}
function render(){document.getElementById('side').classList.remove('open');const m=document.getElementById('main');m.innerHTML=state.page==='overview'?overview():state.page==='logbook'?logbook():state.page==='analytics'?analytics():settings();
 if(state.page==='provider_day'){}
 if(state.page==='logbook'&&unitMode(state.unit)==='provider_day'){const rows=getRows(state.unit),r=rows.find(x=>x.kind==='providerMatrix');if(r)updateProviderKpis(r.matrix||{})}
}
render();
</script>
</body>
</html>
