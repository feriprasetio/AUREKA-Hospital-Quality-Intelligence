import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://ktukmjscopggkzrkgnzp.supabase.co",
  "sb_publishable_6NWrr2xGApSApIjQ0irtvA_U05ZQlFX",
  { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
);

const LOGO = "https://rsudssma.pontianak.go.id/storage/settings/October2023/8ODy7bT72ice4vVuuC9d.png";
const ROOMS_FALLBACK = ["Informasi dan Pengaduan","Informatika dan Teknologi","Instalasi Ambulance","Instalasi Bedah Sentral","Instalasi Farmasi","Instalasi Gawat Darurat","Instalasi Gizi","Instalasi Hemodialisis","Instalasi Laboratorium","Instalasi Radiologi","Instalasi Rawat Jalan","Instalasi Rehab Medik","Instalasi Rekam Medis","Intensive Care Unit & High Care Unit","Komite Medik","Komite Pencegahan dan Pengendalian Infeksi","Manajemen rumah Sakit","Neonatal Intensive Care Unit & Pediatrics High Dependency Unit","Nifas Obstetrics & Gynecology","Perinatology & Neonatology","Promosi Kesehatan Rumah Sakit","Rawat Inap Anak","Rawat Inap Bedah","Rawat Inap Isolasi","Rawat Inap Penyakit Dalam","Rawat Inap Saraf","Rawat Inap VIP","Satuan Pengawas Intern","Tim Investigasi","Tim Koordinasi Pendidikan","Tim Pelayanan Human Immunodeficiency Virus","Tim Pelayanan Keluarga Berencana Rumah Sakit","Tim Pelayanan Obstetri Neonatal Emergensi Komprehensif","Tim Pelayanan Onkologi","Tim Pencegahan Resistensi Antimikroba","Tim Peningkatan Kinerja Klinis","Verlos Kamer"];
const MODULES = [["quality","Indikator Mutu"],["safety","Keselamatan Pasien"],["risk","Manajemen Risiko"],["analytics","Metadata dan Statistik"],["settings","Pengaturan"]];
const CHILD = { quality:["Audit Indikator Mutu","Audit Clinical Pathway","Audit Klinis dan Kematian","Audit OPPE"], safety:["Insiden Keselamatan Pasien","Investigasi / Root Cause Analysis (RCA)","Survey Budaya Keselamatan Pasien"], risk:["Risk Register","FMEA"], analytics:["Statistical Analysis","Data Extraction → XLSX"], settings:["Pengaturan Umum","Manajemen User / PIC Pelaporan"] };
const QUICK = [["quality","Indikator Mutu","Quality"],["safety","Keselamatan Pasien","Safety"],["risk","Manajemen Risiko","Risk"]];
const S = { view:"public", email:"", password:"", fullName:"", roomId:"", rooms:[], message:"", busy:false, system:false, overview:null, user:null, profile:null, room:null, active:"home", mobile:false };

const esc = function(v){
  return String(v == null ? "" : v).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
};
const logo = function(cls){
  return '<img class="' + (cls || "") + '" src="/assets/logo_rsud.png" alt="RSUD Sultan Syarif Mohamad Alkadrie" onerror="this.onerror=null;this.src=\'' + LOGO + '\'">';
};
const glass = function(inner, cls){
  return '<div class="liquidGlass ' + (cls || "") + '"><div class="liquidGlassEdge"></div><div class="liquidGlassSheen"></div><div class="liquidGlassContent">' + inner + '</div></div>';
};
const btn = function(label, fn, cls){
  return '<div class="liquidButton ' + (cls || "") + '"><button type="button" onclick="' + fn + '">' + label + '</button></div>';
};

async function loadRooms(){
  const r = await supabase.from("master_rooms").select("id,name").eq("is_active",true).order("sort_order",{ascending:true});
  S.rooms = (!r.error && r.data && r.data.length) ? r.data : ROOMS_FALLBACK.map(function(n,i){ return {id:i+1,name:n}; });
}
async function loadProfile(uid){
  const r = await supabase.schema("aureka_system").from("user_profiles").select("user_id,full_name,email,primary_room_id,role_id,is_active").eq("user_id",uid).maybeSingle();
  if (r.error) throw new Error("Profil AUREKA tidak dapat dibaca: " + r.error.message);
  return r.data;
}

function quickIcon(id){
  if(id === "quality") return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V9m7 10V5m7 14v-7"></path><path d="M3.5 19.5h17"></path></svg>';
  if(id === "safety") return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 19 6v5.2c0 4.4-2.7 7.9-7 9.3-4.3-1.4-7-4.9-7-9.3V6l7-2.5Z"></path><path d="m8.8 12.1 2.1 2.1 4.5-4.7"></path></svg>';
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 7 4v7.9l-7 4-7-4V7l7-4Z"></path><path d="M5 7 12 11l7-4M12 11v8.7"></path></svg>';
}

function publicView(){
  let quick = "";
  QUICK.forEach(function(m){
    quick += '<button class="quickDockItem quickDock-' + m[0] + '" onclick="openOverview(\'' + m[0] + '\')"><span class="quickDockIcon">' + quickIcon(m[0]) + '</span><span class="quickDockText"><b>' + m[1] + '</b><small>' + m[2] + '</small></span></button>';
  });
  return '<main class="publicRoot">' +
    '<header class="topbar glassPanel"><div class="brand">' + logo() + '<div><b>AUREKA</b><small>Hospital Quality Intelligence</small></div></div>' + btn("Login Workspace","showAuth(\'login\')") + '</header>' +
    '<section class="heroPublic"><div class="heroCopy"><div class="eyebrow">UPT RSUD SULTAN SYARIF MOHAMAD ALKADRIE</div><h1>Alkadrie Unified Risk,<br><em>Evaluation, Quality &amp; Analytics.</em></h1><p>AUREKA mengintegrasikan mutu, keselamatan pasien, manajemen risiko, analitik, dan reporting dalam satu workspace.</p></div>' +
    '<div class="quickDockWrap"><div class="quickDockCaption">Quick overview</div><nav class="quickDock glassPanel">' + quick + '</nav></div></section>' +
    '<div class="systemReveal"><button onclick="toggleSystem()">' + (S.system ? "Sembunyikan status sistem" : "Tampilkan status sistem") + '</button></div>' +
    (S.system ? '<section class="systemPanel glassPanel"><div class="systemGrid">' +
      glass("<strong>37</strong><span>Ruangan aktif</span>") +
      glass("<strong>6</strong><span>Modul terintegrasi</span>") +
      glass("<strong>Online</strong><span>Backend</span>") +
      glass("<strong>Aktif</strong><span>Authentication</span>") +
      '</div></section>' : "") +
    overviewModal() +
    '</main>';
}

function overviewModal(){
  if(!S.overview) return "";
  const m = QUICK.find(function(x){return x[0] === S.overview;});
  if(!m) return "";
  const y = new Date().getFullYear();
  return '<div class="overviewOverlay" onclick="closeOverview()"><section class="overviewModal glassPanel" onclick="event.stopPropagation()">' +
    '<header class="overviewHeader"><div><div class="eyebrow">AUREKA · ' + y + '</div><h2>' + m[1] + '</h2><p>' + m[1] + ' — ' + m[2] + '</p></div><button class="overviewClose" onclick="closeOverview()">×</button></header>' +
    '<div class="overviewStats">' +
    glass("<span>Total data</span><b>—</b><small>Menunggu data modul</small>") +
    glass("<span>Met target</span><b>—</b><small>Belum ada rekaman</small>") +
    glass("<span>Belum met</span><b>—</b><small>Belum ada rekaman</small>") +
    glass("<span>Kelengkapan</span><b>—</b><small>Belum tersedia</small>") +
    '</div><div class="overviewBody"><div class="overviewTrend"><div class="overviewSectionTitle"><b>Trend ' + y + '</b><span>Agregat rumah sakit</span></div><div class="overviewEmpty"><span class="overviewEmptyIcon">∿</span><strong>Belum ada data untuk divisualisasikan</strong><small>Area ini disiapkan untuk trend bulanan, distribusi capaian, dan indikator prioritas setelah data modul mulai terisi.</small></div></div>' +
    '<aside class="overviewSide"><div class="overviewSectionTitle"><b>Snapshot ' + y + '</b><span>Status saat ini</span></div><div class="overviewRows"><div><span>Status data</span><b>Belum tersedia</b></div><div><span>Periode</span><b>Januari–Desember ' + y + '</b></div><div><span>Cakupan</span><b>Seluruh rumah sakit</b></div><div><span>Pembaruan terakhir</span><b>—</b></div></div></aside></div></section></div>';
}

function authView(login){
  let options = S.rooms.map(function(r){return '<option value="' + r.id + '">' + esc(r.name) + '</option>';}).join("");
  let extra = login ? "" :
    '<div class="field"><label>Nama Lengkap</label><input id="fullName" name="full_name" autocomplete="name" value="' + esc(S.fullName) + '" oninput="S.fullName=this.value"></div>' +
    '<div class="field"><label>Ruangan / Unit Utama</label><select id="roomId" name="room_id" onchange="S.roomId=this.value"><option value="">Pilih ruangan</option>' + options + '</select></div>';
  return '<main class="authPage">' + glass(
    '<div class="authLogo">' + logo() + '</div><div class="eyebrow">AUREKA WORKSPACE</div><h1>' + (login ? "Masuk" : "Daftar Akun") + '</h1><p>' +
    (login ? "Gunakan akun AUREKA sesuai role dan unit." : "Registrasi awal untuk calon PIC pelaporan.") + '</p>' + extra +
    '<div class="field"><label>Email</label><input id="email" name="email" type="email" autocomplete="username" inputmode="email" value="' + esc(S.email) + '" oninput="S.email=this.value"></div>' +
    '<div class="field"><label>Password</label><input id="password" name="password" type="password" autocomplete="current-password" value="' + esc(S.password) + '" oninput="S.password=this.value"></div>' +
    btn(S.busy ? "Memproses…" : (login ? "Masuk" : "Buat Akun"), login ? "doLogin()" : "doSignup", "wide") +
    '<div class="' + (S.message ? "msg visible" : "msg") + '">' + esc(S.message) + '</div>' +
    '<button class="textButton" onclick="showAuth(\'' + (login ? "signup" : "login") + '\')">' + (login ? "Daftar akun baru" : "Kembali ke login") + '</button>' +
    '<button class="textButton muted" onclick="showPublic()">← Dashboard publik</button>',
    "authCard"
  ) + '</main>';
}

function workspaceView(){
  const found = MODULES.find(function(x){return x[0] === S.active;});
  const title = found ? found[1] : "Overview";
  let nav = MODULES.map(function(x){return '<button class="' + (S.active === x[0] ? "navActive" : "") + '" onclick="setActive(\'' + x[0] + '\')">' + x[1] + '</button>';}).join("");
  let body = "";
  if(S.active === "home"){
    body = '<div class="workspaceCards">' +
      glass("<span>Unit</span><b>" + esc(S.room && S.room.name ? S.room.name : "Belum dipetakan") + "</b>","metricCard") +
      glass("<span>Laporan terakhir</span><b>—</b>","metricCard") +
      glass("<span>Kepatuhan mutu</span><b>—</b>","metricCard") +
      glass("<span>Action Required</span><b>0</b>","metricCard") +
      '</div>';
  } else {
    let cards = (CHILD[S.active] || []).map(function(x){
      return glass("<b>" + esc(x) + "</b><span>Container modul siap dikembangkan.</span>","placeholderCard");
    }).join("");
    body = '<div class="placeholderGrid">' + cards + '</div>';
  }
  return '<main class="workspaceRoot"><button class="workspaceScrim" onclick="setMobile(false)" data-open="' + S.mobile + '"></button>' +
    '<aside class="sidebar glassPanel ' + (S.mobile ? "mobileOpen" : "") + '">' +
    '<div class="sideBrand">' + logo("sideLogo") + '<div><b>AUREKA</b><small>Hospital Quality Intelligence</small></div></div>' +
    '<div class="navLabel">Workspace</div><button class="' + (S.active === "home" ? "navActive" : "") + '" onclick="setActive(\'home\')">Overview</button>' + nav +
    '<div class="profileChip"><b>' + esc((S.profile && S.profile.full_name) || (S.user && S.user.email) || "") + '</b><span>' + esc((S.room && S.room.name) || "Unit belum dipetakan") + '</span></div>' +
    btn("Logout","doLogout") + '</aside>' +
    '<section class="workspaceContent"><div class="workspaceTop"><button class="mobileMenuButton" onclick="setMobile(true)">☰</button><div><div class="eyebrow">AUREKA</div><h2>' + title + '</h2><p>' + esc((S.profile && S.profile.full_name) || (S.user && S.user.email) || "") + '</p></div></div>' + body +
    '</section></main>';
}

function render(){
  document.getElementById("app").innerHTML = S.view === "public" ? publicView() : S.view === "login" ? authView(true) : S.view === "signup" ? authView(false) : workspaceView();
}

window.showPublic = function(){S.view="public";S.message="";render();};
window.showAuth = function(v){S.view=v;S.message="";render();};
window.toggleSystem = function(){S.system=!S.system;render();};
window.openOverview = function(v){S.overview=v;render();};
window.closeOverview = function(){S.overview=null;render();};
window.setActive = function(v){S.active=v;S.mobile=false;render();};
window.setMobile = function(v){S.mobile=v;render();};

window.doLogin = async function(){
  try{
    const email = String(S.email || "").trim();
    const password = String(S.password || "");
    if(!email) throw new Error("Email wajib diisi.");
    if(!password) throw new Error("Password wajib diisi.");
    S.busy=true;S.message="";render();
    const r=await supabase.auth.signInWithPassword({email:email,password:password});
    if(r.error) throw new Error("Login Supabase gagal: " + r.error.message);
    if(!r.data.session || !r.data.user) throw new Error("Sesi login tidak terbentuk.");
    const verified=await supabase.auth.getUser();
    if(verified.error || !verified.data.user) throw new Error("Sesi autentikasi tidak dapat diverifikasi.");
    const p=await loadProfile(verified.data.user.id);
    if(!p) throw new Error("Profil AUREKA belum tersedia untuk akun ini.");
    if(!p.is_active) throw new Error("Akun belum aktif. Hubungi administrator.");
    S.user=verified.data.user;S.profile=p;
    if(p.primary_room_id){
      const rr=await supabase.from("master_rooms").select("id,name").eq("id",p.primary_room_id).maybeSingle();
      S.room=rr.data || null;
    }
    S.view="workspace";S.active="home";
  }catch(e){S.message=e && e.message ? e.message : "Login gagal.";}
  finally{S.busy=false;render();}
};

window.doSignup = async function(){
  try{
    S.fullName=String(S.fullName || "").trim();
    S.roomId=String(S.roomId || "");
    S.email=String(S.email || "").trim();
    S.password=String(S.password || "");
    if(!S.fullName) throw new Error("Nama lengkap wajib diisi.");
    if(!S.roomId) throw new Error("Silakan pilih ruangan/unit utama.");
    if(!S.email) throw new Error("Email wajib diisi.");
    S.busy=true;S.message="";render();
    if(!S.fullName) throw new Error("Nama lengkap wajib diisi.");
    if(!S.roomId) throw new Error("Silakan pilih ruangan/unit utama.");
    if(S.password.length<8) throw new Error("Password minimal 8 karakter.");
    const r=await supabase.auth.signUp({email:S.email,password:S.password,options:{data:{full_name:S.fullName,primary_room_id:S.roomId}}});
    if(r.error) throw r.error;
    S.message=r.data.session ? "Akun dibuat. Tunggu aktivasi administrator." : "Akun dibuat. Periksa email bila verifikasi diaktifkan, lalu tunggu aktivasi administrator.";
  }catch(e){S.message=e && e.message ? e.message : "Pendaftaran gagal.";}
  finally{S.busy=false;render();}
};

window.doLogout = async function(){
  await supabase.auth.signOut();
  S.user=null;S.profile=null;S.room=null;S.view="public";S.active="home";render();
};

(async function(){
  try{
    await loadRooms();
    const r=await supabase.auth.getSession();
    if(r.data.session){
      const verified=await supabase.auth.getUser();
      if(verified.error) throw verified.error;
      const p=await loadProfile(verified.data.user.id);
      if(p && p.is_active){
        S.user=verified.data.user;S.profile=p;
        if(p.primary_room_id){
          const rr=await supabase.from("master_rooms").select("id,name").eq("id",p.primary_room_id).maybeSingle();
          S.room=rr.data || null;
        }
        S.view="workspace";
      }
    }
  }catch(e){}
  render();
})();
</script><!-- AUREKA GITHUB PAGES AUTH STATE FIX 2026-10-02 -->
</body></html>
