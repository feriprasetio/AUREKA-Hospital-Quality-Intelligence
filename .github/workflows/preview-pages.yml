name: Deploy AUREKA staging preview to GitHub Pages

# The Pages site is a single deployment target. Preserve the current main
# export at the site root and mount the reviewed feature build under /staging/.
on:
  push:
    branches:
      - feat/aureka-2-landing-page
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-staging-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout current production source
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-src

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: production-src/package-lock.json

      - name: Install production dependencies
        working-directory: production-src
        run: npm ci

      - name: Build unchanged production root
        working-directory: production-src
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.AUREKA_PRODUCTION_SUPABASE_URL || secrets.AUREKA_PRODUCTION_SUPABASE_URL || 'https://ktukmjscopggkzrkgnzp.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AUREKA_PRODUCTION_SUPABASE_PUBLISHABLE_KEY || secrets.AUREKA_PRODUCTION_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6NWrr2xGApSApIjQ0irtvA_U05ZQlFX' }}
        run: npm run build

      - name: Checkout AUREKA 2.0 feature build
        uses: actions/checkout@v4
        with:
          ref: feat/aureka-2-landing-page
          path: staging-src

      - name: Install staging dependencies
        working-directory: staging-src
        run: npm ci

      - name: Run staging regression and data validation
        working-directory: staging-src
        run: npm test

      - name: Validate staging Supabase configuration
        working-directory: staging-src
        env:
          AUREKA_BUILD_TARGET: preview
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.AUREKA_STAGING_SUPABASE_URL || secrets.AUREKA_STAGING_SUPABASE_URL || 'https://ypsbvxnqdbjjhlhjerad.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AUREKA_STAGING_SUPABASE_PUBLISHABLE_KEY || secrets.AUREKA_STAGING_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tTgpB91qJSaLmY45NTXVeg_sM0gt53l' }}
        run: node scripts/validate-supabase-build-env.mjs

      - name: Build staging site under /staging/
        working-directory: staging-src
        env:
          AUREKA_BASE_PATH: /AUREKA-Hospital-Quality-Intelligence/staging
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.AUREKA_STAGING_SUPABASE_URL || secrets.AUREKA_STAGING_SUPABASE_URL || 'https://ypsbvxnqdbjjhlhjerad.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AUREKA_STAGING_SUPABASE_PUBLISHABLE_KEY || secrets.AUREKA_STAGING_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tTgpB91qJSaLmY45NTXVeg_sM0gt53l' }}
        run: npm run build

      - name: Assemble Pages artifact without replacing production root
        run: |
          mkdir -p production-src/out/staging
          cp -a staging-src/out/. production-src/out/staging/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: production-src/out

      - name: Deploy combined Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
