name: Deploy NARA Edge Function

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nara-edge-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: supabase-production
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'ktukmjscopggkzrkgnzp' }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          test "$SUPABASE_PROJECT_REF" = "ktukmjscopggkzrkgnzp" || { echo "::error::Unexpected Supabase project ref"; exit 1; }
          test -f supabase/functions/aureka-tanya/index.ts

      - name: Deploy aureka-tanya (JWT verification remains enabled)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'ktukmjscopggkzrkgnzp' }}
        run: |
          supabase functions deploy aureka-tanya --project-ref "$SUPABASE_PROJECT_REF"
