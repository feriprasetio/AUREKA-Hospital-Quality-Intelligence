name: Deploy NARA Edge Function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy aureka-tanya to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'ktukmjscopggkzrkgnzp' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo '::error::Set the SUPABASE_ACCESS_TOKEN repository secret first (Supabase dashboard > Account > Access tokens).'
            exit 1
          fi
          supabase functions deploy aureka-tanya --project-ref "$SUPABASE_PROJECT_REF"
          echo 'Deployed. Verify provider secrets and kill switches in Supabase Edge Function secrets.'
