name: Deploy AUREKA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  security:
    uses: ./.github/workflows/security-scans.yml
    permissions:
      contents: read
      security-events: write
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Enforce production branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production Pages deployment is restricted to refs/heads/main."
            exit 1
          fi

      - name: Checkout AUREKA application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency audit (block moderate, high and critical)
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/audit.json
          audit_exit=$?
          set -e
          AUDIT_EXIT="$audit_exit" node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          if (report.error) {
            throw new Error(`npm audit could not complete: ${report.error.summary ?? report.error.code ?? 'unknown error'}`);
          }
          const vulnerabilities = Object.entries(report.vulnerabilities ?? {});
          const levels = ['critical', 'high', 'moderate', 'low', 'info'];
          const counts = Object.fromEntries(levels.map(level => [
            level,
            vulnerabilities.filter(([, item]) => item.severity === level).length,
          ]));
          console.log('Dependency audit summary:', JSON.stringify(counts));
          for (const [name, item] of vulnerabilities) {
            console.log(`[${item.severity}] ${name} | direct=${item.isDirect} | range=${item.range} | fix=${JSON.stringify(item.fixAvailable ?? false)}`);
            for (const advisory of (item.via ?? []).filter(value => typeof value === 'object')) {
              console.log(`  advisory: ${advisory.title ?? advisory.name ?? 'unnamed'} | ${advisory.url ?? 'URL unavailable'} | range=${advisory.range ?? 'not specified'}`);
            }
          }
          const blocking = vulnerabilities.filter(([, item]) =>
            ['moderate', 'high', 'critical'].includes(item.severity)
          );
          if (blocking.length > 0) {
            console.error(`Security gate failed: ${blocking.length} moderate-or-higher vulnerable package node(s).`);
            process.exitCode = 1;
          } else if (Number(process.env.AUDIT_EXIT ?? 0) !== 0 && vulnerabilities.length === 0) {
            throw new Error('npm audit exited unsuccessfully without a vulnerability report.');
          } else {
            console.log('Security gate passed: no moderate-or-higher findings.');
          }
          NODE

      - name: Run unit tests, data validation, and TypeScript checks
        run: npm test

      - name: Validate production Supabase configuration
        env:
          AUREKA_BUILD_TARGET: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.AUREKA_PRODUCTION_SUPABASE_URL || secrets.AUREKA_PRODUCTION_SUPABASE_URL || 'https://ktukmjscopggkzrkgnzp.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AUREKA_PRODUCTION_SUPABASE_PUBLISHABLE_KEY || secrets.AUREKA_PRODUCTION_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6NWrr2xGApSApIjQ0irtvA_U05ZQlFX' }}
        run: node scripts/validate-supabase-build-env.mjs

      - name: Verify username gateway rejects synthetic invalid login
        env:
          AUREKA_BUILD_TARGET: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.AUREKA_PRODUCTION_SUPABASE_URL || secrets.AUREKA_PRODUCTION_SUPABASE_URL || 'https://ktukmjscopggkzrkgnzp.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AUREKA_PRODUCTION_SUPABASE_PUBLISHABLE_KEY || secrets.AUREKA_PRODUCTION_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6NWrr2xGApSApIjQ0irtvA_U05ZQlFX' }}
        run: node scripts/check-username-gateway.mjs

      - name: Build AUREKA directly for the public project root
        env:
          AUREKA_BASE_PATH: /AUREKA-Hospital-Quality-Intelligence
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.AUREKA_PRODUCTION_SUPABASE_URL || secrets.AUREKA_PRODUCTION_SUPABASE_URL || 'https://ktukmjscopggkzrkgnzp.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AUREKA_PRODUCTION_SUPABASE_PUBLISHABLE_KEY || secrets.AUREKA_PRODUCTION_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6NWrr2xGApSApIjQ0irtvA_U05ZQlFX' }}
        run: npm run build

      - name: Verify removed system-explanatory copy stays out of the public UI
        run: |
          if grep -R -F -n -e 'Cakupan: episode mutu dan Clinical Pathway mengikuti tahun laporan' -e 'Angka dihitung langsung dari database AUREKA sesuai hak akses' -e 'Ini bukan satu periode filter yang diterapkan ke seluruh modul' out; then
            echo '::error::System-explanatory dashboard copy was found in the production artifact.'
            exit 1
          fi
          echo 'Public UI copy check passed.'

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: aureka-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: out

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, security]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: aureka-pages-${{ github.run_id }}-${{ github.run_attempt }}
