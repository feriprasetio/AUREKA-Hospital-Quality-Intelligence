name: Deploy AUREKA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce production branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production Pages deployment is restricted to refs/heads/main."
            exit 1
          fi

      # This immutable release branch keeps the current public root unchanged
      # while the merged AUREKA 2.0 application is reviewed under /staging/.
      - name: Checkout current production release baseline
        uses: actions/checkout@v4
        with:
          ref: aureka-pages-production
          path: production-src
          persist-credentials: false

      - name: Checkout current AUREKA application for staging
        uses: actions/checkout@v4
        with:
          ref: main
          path: staging-src
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            production-src/package-lock.json
            staging-src/package-lock.json

      - name: Install locked production dependencies
        working-directory: production-src
        run: npm ci

      - name: Install locked staging dependencies
        working-directory: staging-src
        run: npm ci

      - name: Dependency audit (block moderate, high and critical)
        working-directory: staging-src
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/audit.json
          audit_exit=$?
          set -e
          AUDIT_EXIT="$audit_exit" node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          if (report.error) {
            throw new Error(`npm audit could not complete: ${report.error.summary ?? report.error.code ?? 'unknown error'}`);
          }
          const vulnerabilities = Object.entries(report.vulnerabilities ?? {});
          const levels = ['critical', 'high', 'moderate', 'low', 'info'];
          const counts = Object.fromEntries(levels.map(level => [
            level,
            vulnerabilities.filter(([, item]) => item.severity === level).length,
          ]));
          console.log('Dependency audit summary:', JSON.stringify(counts));
          for (const [name, item] of vulnerabilities) {
            console.log(`[${item.severity}] ${name} | direct=${item.isDirect} | range=${item.range} | fix=${JSON.stringify(item.fixAvailable ?? false)}`);
            for (const advisory of (item.via ?? []).filter(value => typeof value === 'object')) {
              console.log(`  advisory: ${advisory.title ?? advisory.name ?? 'unnamed'} | ${advisory.url ?? 'URL unavailable'} | range=${advisory.range ?? 'not specified'}`);
            }
          }
          const blocking = vulnerabilities.filter(([, item]) =>
            ['moderate', 'high', 'critical'].includes(item.severity)
          );
          if (blocking.length > 0) {
            console.error(`Security gate failed: ${blocking.length} moderate-or-higher vulnerable package node(s).`);
            process.exitCode = 1;
          } else if (Number(process.env.AUDIT_EXIT ?? 0) !== 0 && vulnerabilities.length === 0) {
            throw new Error('npm audit exited unsuccessfully without a vulnerability report.');
          } else {
            console.log('Security gate passed: no moderate-or-higher findings.');
          }
          NODE

      - name: Test production release baseline
        working-directory: production-src
        run: npm test

      - name: Test staging application and data
        working-directory: staging-src
        run: npm test

      - name: Validate production Supabase configuration
        working-directory: production-src
        env:
          AUREKA_BUILD_TARGET: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.AUREKA_PRODUCTION_SUPABASE_URL || secrets.AUREKA_PRODUCTION_SUPABASE_URL || 'https://ktukmjscopggkzrkgnzp.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AUREKA_PRODUCTION_SUPABASE_PUBLISHABLE_KEY || secrets.AUREKA_PRODUCTION_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6NWrr2xGApSApIjQ0irtvA_U05ZQlFX' }}
        run: node scripts/validate-supabase-build-env.mjs

      - name: Validate isolated staging Supabase configuration
        working-directory: staging-src
        env:
          AUREKA_BUILD_TARGET: preview
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.AUREKA_STAGING_SUPABASE_URL || secrets.AUREKA_STAGING_SUPABASE_URL || 'https://ypsbvxnqdbjjhlhjerad.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AUREKA_STAGING_SUPABASE_PUBLISHABLE_KEY || secrets.AUREKA_STAGING_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tTgpB91qJSaLmY45NTXVeg_sM0gt53l' }}
        run: node scripts/validate-supabase-build-env.mjs

      - name: Build unchanged production root
        working-directory: production-src
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.AUREKA_PRODUCTION_SUPABASE_URL || secrets.AUREKA_PRODUCTION_SUPABASE_URL || 'https://ktukmjscopggkzrkgnzp.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AUREKA_PRODUCTION_SUPABASE_PUBLISHABLE_KEY || secrets.AUREKA_PRODUCTION_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6NWrr2xGApSApIjQ0irtvA_U05ZQlFX' }}
        run: npm run build

      - name: Build AUREKA 2.0 under the staging path
        working-directory: staging-src
        env:
          AUREKA_BASE_PATH: /AUREKA-Hospital-Quality-Intelligence/staging
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.AUREKA_STAGING_SUPABASE_URL || secrets.AUREKA_STAGING_SUPABASE_URL || 'https://ypsbvxnqdbjjhlhjerad.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AUREKA_STAGING_SUPABASE_PUBLISHABLE_KEY || secrets.AUREKA_STAGING_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_tTgpB91qJSaLmY45NTXVeg_sM0gt53l' }}
        run: npm run build

      - name: Combine production root with staging preview path
        run: |
          mkdir -p production-src/out/staging
          cp -a staging-src/out/. production-src/out/staging/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: production-src/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
