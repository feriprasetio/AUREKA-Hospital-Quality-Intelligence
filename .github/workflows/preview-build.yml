name: Preview Build Artifact

# Membangun static export untuk branch fitur agar tampilan dapat diperiksa sebelum
# di-merge ke main (main tetap di-deploy oleh deploy-pages.yml).
on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit (block high and critical)
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/audit.json
          audit_exit=$?
          set -e
          AUDIT_EXIT="$audit_exit" node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8'));
          if (report.error) {
            throw new Error(`npm audit could not complete: ${report.error.summary ?? report.error.code ?? 'unknown error'}`);
          }
          const vulnerabilities = Object.entries(report.vulnerabilities ?? {});
          const levels = ['critical', 'high', 'moderate', 'low', 'info'];
          const counts = Object.fromEntries(levels.map(level => [
            level,
            vulnerabilities.filter(([, item]) => item.severity === level).length,
          ]));
          console.log('Dependency audit summary:', JSON.stringify(counts));
          for (const [name, item] of vulnerabilities) {
            console.log(`[${item.severity}] ${name} | direct=${item.isDirect} | range=${item.range} | fix=${JSON.stringify(item.fixAvailable ?? false)}`);
            for (const advisory of (item.via ?? []).filter(value => typeof value === 'object')) {
              console.log(`  advisory: ${advisory.title ?? advisory.name ?? 'unnamed'} | ${advisory.url ?? 'URL unavailable'} | range=${advisory.range ?? 'not specified'}`);
            }
          }
          const blocking = vulnerabilities.filter(([, item]) =>
            item.severity === 'critical' || item.severity === 'high'
          );
          if (blocking.length > 0) {
            console.error(`Security gate failed: ${blocking.length} high/critical vulnerable package(s).`);
            process.exitCode = 1;
          } else if (Number(process.env.AUDIT_EXIT ?? 0) !== 0 && vulnerabilities.length === 0) {
            throw new Error('npm audit exited unsuccessfully without a vulnerability report.');
          } else {
            console.log('Security gate passed: no high/critical findings. Moderate and lower findings remain visible for triage.');
          }
          NODE
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: npm run test:data
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: aureka-static-export
          path: ./out
          retention-days: 7
