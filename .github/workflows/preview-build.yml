name: Preview Build Artifact

# Membangun static export untuk branch fitur agar tampilan dapat diperiksa sebelum
# di-merge ke main (main tetap di-deploy oleh deploy-pages.yml).
on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: aureka-static-export
          path: ./out
          retention-days: 7
      - name: Publish preview to ci-preview-build branch
        run: |
          cd out
          git init -q -b ci-preview-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "preview build ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-preview-build
