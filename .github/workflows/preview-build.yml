name: Preview Build Artifact

# Membangun static export untuk branch fitur agar tampilan dapat diperiksa sebelum
# di-merge ke main (main tetap di-deploy oleh deploy-pages.yml).
on:
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: aureka-static-export
          path: ./out
          retention-days: 7
