name: One-time delete obsolete ICU source workbook

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-delete-icu-source-workbook.yml

permissions:
  contents: read

concurrency:
  group: aureka-single-source-workbook-removal
  cancel-in-progress: false

jobs:
  delete-exact-object:
    runs-on: ubuntu-latest
    environment: supabase-production
    steps:
      - name: Checkout approved production repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup official Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Validate project scope and credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ktukmjscopggkzrkgnzp
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_REF" = "ktukmjscopggkzrkgnzp"
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo '::error::Supabase Personal Access Token is missing.'
            exit 1
          fi
          # Token format is validated by Supabase CLI, including scoped and
          # future PAT forms; do not print or expose the credential.
          supabase --version

      - name: Delete ONLY the approved obsolete workbook through the Storage API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ktukmjscopggkzrkgnzp
        shell: bash
        run: |
          set -euo pipefail
          object='ss:///aureka-quality-source-workbooks/14/2026/1794965982596_PMKP_-_Intensive_Care_Unit_-_2026.xlsx'
          # Never use --recursive. All other Storage objects and the two
          # PostgreSQL signature image assets remain outside this action.
          if supabase storage rm --help | grep -q -- '--remote'; then
            supabase storage rm "$object" --remote="$PROJECT_REF" --experimental
            supabase storage ls 'ss:///aureka-quality-source-workbooks/14/2026' --remote="$PROJECT_REF" --experimental > /tmp/aureka-storage-after.txt
          else
            # Supabase CLI v2 compatibility, only if the installed CLI lacks --remote.
            supabase link --project-ref "$PROJECT_REF"
            supabase storage rm "$object" --experimental --linked
            supabase storage ls 'ss:///aureka-quality-source-workbooks/14/2026' --experimental --linked > /tmp/aureka-storage-after.txt
          fi
          if grep -Fq '1794965982596_PMKP_-_Intensive_Care_Unit_-_2026.xlsx' /tmp/aureka-storage-after.txt; then
            echo '::error::Target workbook still appears in Storage after attempted deletion'
            exit 1
          fi
          echo 'The exact obsolete workbook was removed through the Storage API.'
