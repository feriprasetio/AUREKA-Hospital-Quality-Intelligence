name: Visual Intelligence pull request checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-intelligence-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Unit tests, data validation, and type checks
        run: npm test
      - name: Production static export build
        env:
          AUREKA_BASE_PATH: /AUREKA-Hospital-Quality-Intelligence
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.AUREKA_PRODUCTION_SUPABASE_URL || secrets.AUREKA_PRODUCTION_SUPABASE_URL || 'https://ktukmjscopggkzrkgnzp.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.AUREKA_PRODUCTION_SUPABASE_PUBLISHABLE_KEY || secrets.AUREKA_PRODUCTION_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_6NWrr2xGApSApIjQ0irtvA_U05ZQlFX' }}
        run: npm run build
