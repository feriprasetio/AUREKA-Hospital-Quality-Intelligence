name: AUREKA security scans
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aureka-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    name: Secret scan (redacted)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks CLI
        run: |
          GOBIN="$RUNNER_TEMP/bin" GOTOOLCHAIN=auto go install github.com/zricethezav/gitleaks/v8@v8.30.0
      - name: Scan checked-out files
        run: '"$RUNNER_TEMP/bin/gitleaks" dir --redact=100 --no-banner .'
      - name: Scan reachable Git history
        if: always()
        run: '"$RUNNER_TEMP/bin/gitleaks" git --redact=100 --no-banner --log-opts="--all" .'
  codeql:
    name: CodeQL JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
