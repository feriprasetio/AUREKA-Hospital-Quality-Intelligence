name: Patient Safety Build Check

on:
  push:
    branches:
      - feat/patient-safety-workspace
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Unit, data, and TypeScript tests
        run: npm test
      - name: Next.js static export build
        run: npm run build
