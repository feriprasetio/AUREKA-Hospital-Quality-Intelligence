name: AUREKA OPPE build validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/OppeAuditWorkspace.tsx'
      - 'components/QualityHub.tsx'
      - 'components/HomeClient.tsx'
      - 'components/ClinicalPathwayWorkspace.tsx'
      - 'components/ClinicalDeathAuditWorkspace.tsx'
      - 'components/ClinicalPathwayWorkspace.tsx'
      - 'components/ClinicalDeathAuditWorkspace.tsx'
      - 'lib/aureka/oppe-engine.ts'
      - 'components/QualityIndicatorWorkspace.tsx'
      - 'components/QualityExcelPastePanel.tsx'
      - 'lib/aureka/excel-paste.ts'
      - 'supabase/migrations/20261029013512_quality_logbook_atomic_save.sql'
      - 'supabase/migrations/20261029014335_quality_logbook_require_valid_role.sql'
      - 'tests/excel-paste.test.mjs'
      - 'components/PatientSafetyWorkspace.tsx'
      - 'components/StaffDirectoryWorkspace.tsx'
      - 'components/StaffTeamWorkspace.tsx'
      - 'components/MetadataStatisticsWorkspace.tsx'
      - 'supabase/migrations/20261027120000_staff_directory_team_locking.sql'
      - 'supabase/migrations/20261027130000_staff_team_updated_at.sql'
      - 'supabase/migrations/20261027140000_staff_entity_attributions.sql'
      - 'supabase/migrations/20261027150000_staff_identity_clinical_modules.sql'
      - 'supabase/migrations/20261027160000_staff_assignment_picker_rpc.sql'
      - 'supabase/migrations/20261027170000_staff_identity_review_resolution.sql'
      - 'supabase/migrations/20261027170000_staff_identity_review_resolution.sql'
      - 'supabase/migrations/20261026120000_oppe_audit_engine.sql'
      - 'supabase/migrations/20261027023830_oppe_validation_integrity.sql'
      - 'package.json'
      - 'tests/oppe-engine.test.mjs'
      - '.github/workflows/oppe-build-validation.yml'
  push:
    branches:
      - main
      - fix/oppe-engine-hardening-20261027
    paths:
      - 'components/OppeAuditWorkspace.tsx'
      - 'components/QualityHub.tsx'
      - 'components/HomeClient.tsx'
      - 'components/ClinicalPathwayWorkspace.tsx'
      - 'components/ClinicalDeathAuditWorkspace.tsx'
      - 'components/ClinicalPathwayWorkspace.tsx'
      - 'components/ClinicalDeathAuditWorkspace.tsx'
      - 'lib/aureka/oppe-engine.ts'
      - 'components/QualityIndicatorWorkspace.tsx'
      - 'components/QualityExcelPastePanel.tsx'
      - 'lib/aureka/excel-paste.ts'
      - 'supabase/migrations/20261029013512_quality_logbook_atomic_save.sql'
      - 'supabase/migrations/20261029014335_quality_logbook_require_valid_role.sql'
      - 'tests/excel-paste.test.mjs'
      - 'components/PatientSafetyWorkspace.tsx'
      - 'components/StaffDirectoryWorkspace.tsx'
      - 'components/StaffTeamWorkspace.tsx'
      - 'components/MetadataStatisticsWorkspace.tsx'
      - 'supabase/migrations/20261027120000_staff_directory_team_locking.sql'
      - 'supabase/migrations/20261027130000_staff_team_updated_at.sql'
      - 'supabase/migrations/20261027140000_staff_entity_attributions.sql'
      - 'supabase/migrations/20261027150000_staff_identity_clinical_modules.sql'
      - 'supabase/migrations/20261027160000_staff_assignment_picker_rpc.sql'
      - 'supabase/migrations/20261026120000_oppe_audit_engine.sql'
      - 'supabase/migrations/20261027023830_oppe_validation_integrity.sql'
      - 'package.json'
      - 'tests/oppe-engine.test.mjs'
      - '.github/workflows/oppe-build-validation.yml'

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: OPPE engine regression tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Build Next.js application
        run: npm run build
