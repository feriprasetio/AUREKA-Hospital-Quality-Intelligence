name: AUREKA OPPE build validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'components/OppeAuditWorkspace.tsx'
      - 'lib/aureka/oppe-engine.ts'
      - 'components/QualityIndicatorWorkspace.tsx'
      - 'supabase/migrations/20261026120000_oppe_audit_engine.sql'
      - 'supabase/migrations/20261027023830_oppe_validation_integrity.sql'
      - 'package.json'
      - 'tests/oppe-engine.test.mjs'
      - '.github/workflows/oppe-build-validation.yml'
  push:
    branches:
      - main
      - fix/oppe-engine-hardening-20261027
    paths:
      - 'components/OppeAuditWorkspace.tsx'
      - 'lib/aureka/oppe-engine.ts'
      - 'components/QualityIndicatorWorkspace.tsx'
      - 'supabase/migrations/20261026120000_oppe_audit_engine.sql'
      - 'supabase/migrations/20261027023830_oppe_validation_integrity.sql'
      - 'package.json'
      - 'tests/oppe-engine.test.mjs'
      - '.github/workflows/oppe-build-validation.yml'

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: OPPE engine regression tests
        run: node --experimental-strip-types --test tests/oppe-engine.test.mjs
      - name: TypeScript type check
        run: npx tsc --noEmit
      - name: Build Next.js application
        run: npm run build
