<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUREKA — Hospital Quality Intelligence</title><style>
:root{--g:#0f7d57;--g2:#0a4f3a;--ink:#121722;--m:#697386;--l:#e8ebf0;--bg:#f7f8fb}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}button,input{font:inherit}.top{height:74px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--l);position:sticky;top:0;z-index:10}.brand{display:flex;gap:10px;align-items:center}.brand img,.logo img{width:40px;height:40px;object-fit:contain}.brand b{display:block}.brand small{display:block;color:var(--m);font-size:11px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#151922;color:#fff;font-weight:700;cursor:pointer}.content{max-width:1240px;margin:auto;padding:34px}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:28px;align-items:center;padding:24px 0 38px}.ey{font-size:11px;letter-spacing:.12em;font-weight:800;color:#6d7481}.hero h1{font-size:52px;line-height:1.05;margin:10px 0}.hero h1 em{color:var(--g);font-style:normal}.hero p{color:var(--m);line-height:1.7;max-width:780px}.orb{min-height:260px;border-radius:26px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;display:grid;place-items:center;text-align:center;box-shadow:0 20px 55px #0a4f3a22}.orb img{filter:brightness(0) invert(1);width:90px;height:90px}.orb strong{font-size:29px}.orb small{opacity:.78}.section{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.section h2{font-size:17px;margin:0}.pill{font-size:10px;font-weight:800;letter-spacing:.08em;background:#eaf4ef;color:#176b50;padding:6px 9px;border-radius:999px}.grid,.mods{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.mods{grid-template-columns:repeat(3,1fr)}.card,.mod{background:#fff;border:1px solid var(--l);border-radius:15px;padding:18px}.lab{font-size:10px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}.val{font-size:27px;font-weight:850;margin-top:4px}.sub{font-size:11px;color:var(--m);margin-top:4px}.mod{text-align:left;cursor:pointer}.mod:hover{box-shadow:0 10px 25px #0000000a}.mod b{display:block}.mod span{display:block;font-size:11px;line-height:1.5;color:var(--m);margin-top:4px}.notice{padding:14px 16px;background:#fff;border:1px solid var(--l);border-radius:13px}.good{background:#effaf4;border-color:#cde8d9;color:#126346}.bad{background:#fff0f3;border-color:#f2c9d2;color:#8a2030}.login{min-height:100vh;display:grid;place-items:center}.login-card{width:min(420px,92vw);background:#fff;border:1px solid var(--l);border-radius:22px;padding:30px}.field{margin:15px 0}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid var(--l);border-radius:9px}.switch{text-align:center;color:var(--m);font-size:12px;margin-top:13px}.link{border:0;background:none;color:#2457d6;cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{background:#fff;border-right:1px solid var(--l);padding:20px;min-height:100vh}.nav{display:grid;gap:5px;margin-top:18px}.nav button{border:0;background:none;text-align:left;padding:11px;border-radius:10px;cursor:pointer;color:#3f4652}.nav button.active,.nav button:hover{background:#edf5f1;color:#126346}.work{padding:26px 30px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.head h1{margin:0}.head p{color:var(--m);font-size:12px;margin:4px 0}.room{margin-top:22px;padding:9px 11px;border-radius:999px;background:#edf5f1;color:#126346;font-size:11px;font-weight:800;display:inline-block}.mobile{display:none}@media(max-width:950px){.hero{grid-template-columns:1fr}.g4,.mods{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.content{padding:20px 14px}.hero h1{font-size:38px}.g4,.mods{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.side{position:fixed;left:-280px;width:260px;z-index:20;transition:.2s}.side.open{left:0}.mobile{display:block}.work{padding:18px 14px}}
</style></head><body><div id="root"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const C={url:'https://ktukmjscopggkzrkgnzp.supabase.co',key:'sb_publishable_6NWrr2xGApSApIjQ0irtvA_U05ZQlFX'},logoUrl='https://rsudssma.pontianak.go.id/storage/settings/October2023/8ODy7bT72ice4vVuuC9d.png';let sb=supabase.createClient(C.url,C.key),session,profile,room,active='home';
const M=[['home','0','Overview','Capaian keseluruhan & dashboard unit'],['quality','1','Indikator Mutu','Audit indikator, CP, klinis/kematian, OPPE'],['safety','2','Keselamatan Pasien','IKP, Investigasi/RCA, budaya keselamatan'],['risk','3','Manajemen Risiko','Risk Register dan FMEA'],['analytics','4','Metadata dan Statistik','Uji statistik & extract XLSX'],['settings','5','Pengaturan','Pengaturan umum & PIC pelaporan']];
const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function L(){return '<img src="/assets/logo_rsud.png" onerror="this.onerror=null;this.src=\''+logoUrl+'\'" alt="Logo RSUD">'}
function pub(){document.body.innerHTML='<div class="top"><div class="brand">'+L()+'<div><b>AUREKA</b><small>Hospital Quality Intelligence</small></div></div><button class="btn" id="login">Login Workspace</button></div><main class="content"><section class="hero"><div><div class="ey">UPT RSUD SULTAN SYARIF MOHAMAD ALKADRIE</div><h1>Mutu rumah sakit,<br><em>terlihat dalam data.</em></h1><p>AUREKA mengintegrasikan mutu, keselamatan pasien, manajemen risiko, analitik dan reporting dalam satu workspace.</p><button class="btn" id="enter">Masuk ke Workspace</button></div><div class="orb">'+L()+'<strong>AUREKA</strong><small>Quality Intelligence</small></div></section><div class="section"><h2>System Pulse</h2><span class="pill">PUBLIC OVERVIEW</span></div><section class="grid g4"><div class="card"><div class="lab">Ruangan</div><div class="val">37</div><div class="sub">Master unit aktif</div></div><div class="card"><div class="lab">Modul Utama</div><div class="val">6</div><div class="sub">Architecture v1</div></div><div class="card"><div class="lab">Backend</div><div class="val" id="be">…</div><div class="sub">Supabase</div></div><div class="card"><div class="lab">Build</div><div class="val">Clean</div><div class="sub">Rebuild baseline</div></div></section><div class="section"><h2>Workspace</h2></div><section class="mods">'+M.map(m=>'<button class="mod" data-open="'+m[0]+'"><b>'+m[1]+'. '+m[2]+'</b><span>'+m[3]+'</span></button>').join('')+'</section><div class="section"><h2>Status Platform</h2></div><div class="notice" id="st">Menghubungkan…</div></main>';$('login').onclick=login;$('enter').onclick=login;document.querySelectorAll('[data-open]').forEach(x=>x.onclick=login);ping()}
async function ping(){try{let r=await sb.auth.getSession();if(r.error)throw r.error;$('be').textContent='OK';$('st').className='notice good';$('st').innerHTML='<b>Connected</b> — UI terhubung ke Supabase clean rebuild.'}catch(e){$('be').textContent='—';$('st').className='notice bad';$('st').innerHTML='<b>Backend belum tersambung.</b><br>'+esc(e.message)}}
function login(){document.body.innerHTML='<main class="login"><section class="login-card">'+L()+'<h1>AUREKA Workspace</h1><p class="sub">Login sesuai akun dan role yang diberikan administrator.</p><div class="field"><label>Email</label><input id="e" type="email"></div><div class="field"><label>Password</label><input id="p" type="password"></div><button class="btn" style="width:100%" id="go">Masuk</button><div class="switch" id="msg"></div><div class="switch"><button class="link" id="back">← Dashboard publik</button></div></section></main>';$('go').onclick=signin;$('p').onkeydown=x=>x.key==='Enter'&&signin();$('back').onclick=pub}
async function signin(){let b=$('go'),m=$('msg');b.disabled=true;m.textContent='';try{let r=await sb.auth.signInWithPassword({email:$('e').value.trim(),password:$('p').value});if(r.error)throw r.error;session=r.data.session;await ident();workspace()}catch(e){m.textContent=e.message}finally{b.disabled=false}}
async function ident(){let u=session.user,p=await sb.from('user_profiles').select('user_id,full_name,email,primary_room_id,role_id,is_active').eq('user_id',u.id).maybeSingle();if(p.error)throw p.error;if(!p.data)throw Error('Profil user belum dibuat.');profile=p.data;if(profile.primary_room_id){let r=await sb.from('master_rooms').select('id,code,name').eq('id',profile.primary_room_id).maybeSingle();if(r.error)throw r.error;room=r.data}}
function workspace(){let nav=M.map(m=>'<button data-p="'+m[0]+'" class="'+(m[0]===active?'active':'')+'">'+m[1]+'. '+m[2]+'</button>').join('');document.body.innerHTML='<div class="shell"><aside class="side" id="side"><div class="brand">'+L()+'<div><b>AUREKA</b><small>Hospital Quality Intelligence</small></div></div><div class="nav">'+nav+'</div><div class="room">'+esc(room?.name||'Unit belum dipetakan')+'</div></aside><main class="work"><div class="head"><div><h1 id="t">Overview</h1><p>'+esc(profile.full_name||session.user.email)+'</p></div><div><button class="mobile" id="menu">☰</button> <button class="btn" id="out">Logout</button></div></div><div id="c"></div></main></div>';$('out').onclick=async()=>{await sb.auth.signOut();session=profile=room=null;active='home';pub()};$('menu').onclick=()=>$('side').classList.toggle('open');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{active=b.dataset.p;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});render()}
function render(){let n=M.find(x=>x[0]===active);$('t').textContent=n[2];if(active==='home'){$('c').innerHTML='<div class="section"><h2>Personal Overview</h2><span class="pill">ROLE / UNIT BASED</span></div><section class="grid g4"><div class="card"><div class="lab">Unit</div><div class="val" style="font-size:18px">'+esc(room?.name||'Belum dipetakan')+'</div></div><div class="card"><div class="lab">Laporan terakhir</div><div class="val">—</div><div class="sub">Menunggu modul audit</div></div><div class="card"><div class="lab">Kepatuhan mutu</div><div class="val">—</div><div class="sub">Belum ada data</div></div><div class="card"><div class="lab">Action Required</div><div class="val">0</div><div class="sub">Clean rebuild baseline</div></div></section>'}else{let s={quality:[['1.1','Audit Indikator Mutu'],['1.2','Audit Clinical Pathway'],['1.3','Audit Klinis dan Kematian'],['1.4','Audit OPPE']],safety:[['2.1','Insiden Keselamatan Pasien'],['2.2','Investigasi / Root Cause Analysis (RCA)'],['2.3','Survey Budaya Keselamatan Pasien']],risk:[['3.1','Risk Register'],['3.2','FMEA']],analytics:[['4.1','Statistical Analysis'],['4.2','Data Extraction → XLSX']],settings:[['5.1','Pengaturan Umum'],['5.2','Manajemen User / PIC Pelaporan']]}[active]||[];$('c').innerHTML='<div class="section"><h2>Module Storage</h2><span class="pill">READY FOR DESIGN</span></div><section class="mods">'+s.map(x=>'<div class="mod"><b>'+x[0]+' · '+x[1]+'</b><span>Container aktif. Business logic akan dibangun setelah desain modul disepakati.</span></div>').join('')+'</section><div class="section"><h2>Unit Context</h2></div><div class="card"><div class="lab">Dashboard unit</div><div class="val" style="font-size:21px">'+esc(room?.name||'Belum dipetakan')+'</div><div class="sub">Tampilan operasional dibatasi sesuai unit/permission user.</div></div>'}}
(async()=>{let r=await sb.auth.getSession();if(r.data.session){session=r.data.session;try{await ident();workspace()}catch{await sb.auth.signOut();pub()}}else pub()})();
</script></body></html>
