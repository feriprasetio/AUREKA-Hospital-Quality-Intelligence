<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUREKA — Hospital Quality Intelligence</title><meta name="description" content="AUREKA — Hospital Quality Intelligence"><style>:root{--green:#0d6f52;--green2:#084e3a;--ink:#111713;--muted:#6d766f;--line:#e1e7e3;--bg:#f5f7f6;--blue:#2457d6;--danger:#a51f2a;--good:#126346;--ease:cubic-bezier(.2,.75,.2,1)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f8faf9 0%,#f1f4f2 100%)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(36,87,214,.16);outline-offset:2px}.top{position:sticky;top:0;z-index:40;height:70px;margin:12px 18px 0;padding:0 18px 0 20px;border-radius:20px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.92);border:1px solid rgba(17,23,19,.06);box-shadow:0 10px 28px rgba(20,35,28,.06);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:10px}.brand img{width:38px;height:38px;object-fit:contain}.brand b{display:block;font-size:15px;letter-spacing:-.02em}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.btn{border:0;border-radius:999px;padding:11px 17px;font-weight:750;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.985)}.btn.primary{color:#fff;background:linear-gradient(135deg,#13775a,#0a5b44);box-shadow:0 9px 22px rgba(13,111,82,.18)}.btn.secondary{color:var(--ink);background:#eef1ef;border:1px solid #dfe4e0}.content{max-width:1360px;margin:auto;padding:34px 30px 72px}.hero{display:grid;grid-template-columns:1.05fr .82fr;gap:46px;align-items:center;padding:48px 0 56px}.eyebrow{font-size:10px;letter-spacing:.15em;font-weight:800;color:#7b847e}.hero h1{font-size:clamp(48px,5.5vw,74px);line-height:.98;letter-spacing:-.065em;margin:14px 0 18px}.hero h1 em{font-style:normal;color:var(--green)}.hero p{max-width:760px;color:var(--muted);font-size:16px;line-height:1.72;margin:0}.hero-card{min-height:300px;max-width:520px;margin-left:auto;border-radius:30px;padding:42px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff;background:linear-gradient(145deg,rgba(13,111,82,.86),rgba(8,78,58,.78));border:1px solid rgba(255,255,255,.28);box-shadow:0 26px 64px rgba(8,78,58,.18);backdrop-filter:blur(15px) saturate(120%);-webkit-backdrop-filter:blur(15px) saturate(120%);position:relative;overflow:hidden}.hero-card:before{content:"";position:absolute;width:220px;height:220px;right:-100px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 68%)}.hero-mark{font-size:clamp(58px,7vw,88px);font-weight:900;letter-spacing:-.08em;line-height:.9;background:linear-gradient(180deg,#fff,#d6f7e9);-webkit-background-clip:text;background-clip:text;color:transparent;position:relative}.hero-sub{margin-top:15px;font-size:12px;color:rgba(255,255,255,.82);position:relative}.section{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:28px 0 13px}.section h2{font-size:19px;letter-spacing:-.03em;margin:0}.grid,.modules{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.modules{grid-template-columns:repeat(3,minmax(0,1fr))}.card,.module-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:19px}.module-card{text-align:left;transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}.module-card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(20,35,28,.08);border-color:#d4ded8}.module-card b{display:block;font-size:14px}.module-card span{display:block;margin-top:6px;color:var(--muted);font-size:11px;line-height:1.5}.label{font-size:10px;color:#87918b;text-transform:uppercase;letter-spacing:.1em}.value{font-size:29px;font-weight:850;letter-spacing:-.04em;margin-top:5px}.sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}.notice{padding:14px 16px;border-radius:15px;font-size:12px;line-height:1.55}.notice.good{background:#eff9f4;border:1px solid #d7ece1;color:#146549}.notice.bad{background:#fff1f3;border:1px solid #f0cfd5;color:#962432}.system-toggle{margin-top:38px;text-align:center}.system-toggle button{border:0;background:#e9eeeb;color:#315148;border-radius:999px;padding:10px 14px;font-size:11px;font-weight:750}.system-panel{display:none;margin-top:12px}.system-panel.open{display:block}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#f8faf9,#edf2ef)}.login-card{width:min(500px,94vw);background:#fff;border:1px solid var(--line);border-radius:28px;padding:32px;box-shadow:0 24px 70px rgba(20,35,28,.10)}.login-logo{width:64px;height:64px;margin:0 auto 14px;display:grid;place-items:center}.login-logo img{width:52px;height:52px;object-fit:contain}.login-card h1{text-align:center;font-size:26px;letter-spacing:-.045em;margin:0}.login-card p{text-align:center;color:var(--muted);font-size:12px;line-height:1.55;margin:8px 0 22px}.field{margin:14px 0}.field label{display:block;margin-bottom:6px;font-size:11px;font-weight:800;color:#4f5b54}.field input,.field select{width:100%;height:46px;padding:0 13px;border:1px solid #d8ded9;border-radius:13px;background:#fff;color:var(--ink)}.field input:focus,.field select:focus{border-color:#8eb0a2;box-shadow:0 0 0 4px rgba(13,111,82,.07)}.helper{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.4}.msg{min-height:20px;margin-top:10px;font-size:11px;color:var(--danger)}.msg.good{color:var(--good)}.switch{text-align:center;color:var(--muted);font-size:11px;margin-top:13px}.link{border:0;background:none;color:var(--green);padding:0;font-weight:800}.workspace{min-height:100vh;display:grid;grid-template-columns:274px 1fr}.side{position:sticky;top:0;height:100vh;padding:18px;background:#fbfcfb;border-right:1px solid var(--line)}.side .brand{padding:4px 4px 20px}.nav-title{font-size:9px;color:#8b9490;text-transform:uppercase;letter-spacing:.13em;margin:10px 8px 8px}.nav{display:grid;gap:4px}.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#4d5953;text-align:left;padding:10px 11px;border-radius:12px;font-size:11px;transition:.18s var(--ease)}.nav button:hover{background:#f0f4f2;color:#12664b;transform:translateX(2px)}.nav button.active{background:#eaf3ef;color:#0f7656;font-weight:800}.nav-icon{width:18px;display:grid;place-items:center}.user-box{margin-top:22px;padding:12px;border:1px solid var(--line);border-radius:15px;background:#f8faf9}.user-box b{display:block;font-size:12px}.user-box span{display:block;color:var(--muted);font-size:10px;margin-top:3px;line-height:1.45}.work{padding:24px 30px;min-width:0}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.head h1{margin:0;font-size:29px;letter-spacing:-.045em}.head p{margin:5px 0 0;color:var(--muted);font-size:11px}.action{display:flex;gap:8px}.mobile{display:none;border:1px solid #dfe4e0;background:#eef1ef;border-radius:11px;padding:9px}@media(max-width:1000px){.hero{grid-template-columns:1fr}.hero-card{margin:0 auto;width:min(620px,100%)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.modules{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.top{margin:8px 8px 0;height:66px}.content{padding:20px 14px 56px}.hero{padding:30px 0 42px;gap:28px}.hero h1{font-size:44px}.hero-card{min-height:270px;border-radius:26px;padding:34px 24px}.g4,.modules{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.side{position:fixed;left:-292px;width:274px;z-index:60;transition:left .25s var(--ease)}.side.open{left:0}.mobile{display:block}.work{padding:18px 14px}.head h1{font-size:23px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head><body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const CONFIG={url:'https://ktukmjscopggkzrkgnzp.supabase.co',key:'sb_publishable_6NWrr2xGApSApIjQ0irtvA_U05ZQlFX'},OFFICIAL_LOGO='https://rsudssma.pontianak.go.id/storage/settings/October2023/8ODy7bT72ice4vVuuC9d.png',sb=supabase.createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const MODULES=[{id:'home',name:'Overview',desc:'Capaian keseluruhan dan dashboard unit',icon:'⌂'},{id:'quality',name:'Indikator Mutu',desc:'Audit indikator, Clinical Pathway, klinis/kematian, OPPE',icon:'◈'},{id:'safety',name:'Keselamatan Pasien',desc:'IKP, investigasi/RCA, budaya keselamatan',icon:'✚'},{id:'risk',name:'Manajemen Risiko',desc:'Risk Register dan FMEA',icon:'△'},{id:'analytics',name:'Metadata dan Statistik',desc:'Uji statistik dan Data Extraction XLSX',icon:'∑'},{id:'settings',name:'Pengaturan',desc:'Pengaturan umum dan manajemen PIC',icon:'⚙'}];let session=null,profile=null,room=null,active='home';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function logo(c=''){return '<div class="'+c+'"><img src="/assets/logo_rsud.png" alt="Logo RSUD Sultan Syarif Mohamad Alkadrie" onerror="this.onerror=null;this.src=\''+OFFICIAL_LOGO+'\'"></div>'}function publicPage(){$('app').innerHTML='<div class="top"><div class="brand">'+logo()+'<div><b>AUREKA</b><small>Hospital Quality Intelligence</small></div></div><button class="btn primary" id="loginBtn">Login Workspace</button></div><main class="content"><section class="hero"><div><div class="eyebrow">UPT RSUD SULTAN SYARIF MOHAMAD ALKADRIE</div><h1>Mutu rumah sakit,<br><em>terlihat dalam data.</em></h1><p>AUREKA mengintegrasikan mutu, keselamatan pasien, manajemen risiko, analitik, dan reporting dalam satu workspace. Satu fondasi untuk mengubah laporan menjadi informasi, informasi menjadi insight, dan insight menjadi perbaikan.</p></div><div class="hero-card"><div class="hero-mark">AUREKA</div><div class="hero-sub">Hospital Quality Intelligence</div></div></section><div class="section"><h2>Workspace</h2></div><section class="modules">'+MODULES.filter(m=>m.id!==\'home\').map(m=>'<div class="module-card"><b>'+m.name+'</b><span>'+m.desc+'</span></div>').join('')+'</section><div class="system-toggle"><button id="systemToggle" type="button">Tampilkan status sistem</button></div><div class="system-panel" id="systemPanel"><div class="grid g4"><div class="card"><div class="label">Ruangan terdaftar</div><div class="value">37</div><div class="sub">Master unit rumah sakit</div></div><div class="card"><div class="label">Modul terintegrasi</div><div class="value">6</div><div class="sub">Registry modul AUREKA</div></div><div class="card"><div class="label">Status backend</div><div class="value" id="backend">…</div><div class="sub">Supabase</div></div><div class="card"><div class="label">Status autentikasi</div><div class="value">Aktif</div><div class="sub">Session persistence</div></div></div><div class="section"><h2>Status Platform</h2></div><div class="notice" id="status">Menghubungkan ke Supabase…</div></div></main>';$('loginBtn').onclick=loginPage;const st=$('systemToggle');st.onclick=()=>{const p=$('systemPanel');p.classList.toggle('open');st.textContent=p.classList.contains('open')?'Sembunyikan status sistem':'Tampilkan status sistem'};checkBackend()}async function checkBackend(){try{const r=await sb.auth.getSession();if(r.error)throw r.error;const b=$('backend'),st=$('status');if(b)b.textContent='OK';if(st){st.className='notice good';st.innerHTML='<b>Connected</b> — antarmuka siap terhubung ke backend AUREKA.'}}catch(e){const b=$('backend'),st=$('status');if(b)b.textContent='—';if(st){st.className='notice bad';st.innerHTML='<b>Backend belum tersambung.</b><br>'+esc(e.message||e)}}}function loginPage(){$('app').innerHTML='<main class="login"><section class="login-card">'+logo('login-logo')+'<h1>AUREKA Workspace</h1><p>Masuk menggunakan akun AUREKA sesuai role dan unit yang diberikan administrator.</p><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%" id="loginSubmit" type="submit">Masuk</button></form><div class="msg" id="loginMsg"></div><div class="switch">Belum punya akun? <button class="link" id="signupLink" type="button">Daftar akun baru</button></div><div class="switch"><button class="link" id="backLink" type="button">← Dashboard publik</button></div></section></main>';$('loginForm').addEventListener('submit',e=>{e.preventDefault();signIn()});$('signupLink').onclick=signupPage;$('backLink').onclick=publicPage}async function signIn(){const b=$('loginSubmit'),m=$('loginMsg');b.disabled=true;m.textContent='';try{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;session=r.data.session;await loadProfile();workspacePage()}catch(e){m.textContent=e.message||'Login gagal.'}finally{b.disabled=false}}function signupPage(){$('app').innerHTML='<main class="login"><section class="login-card">'+logo('login-logo')+'<h1>Daftar Akun AUREKA</h1><p>Registrasi awal untuk calon PIC pelaporan. Pilih unit utama saat membuat akun.</p><form id="signupForm"><div class="field"><label for="fullName">Nama Lengkap</label><input id="fullName" type="text" autocomplete="name" required></div><div class="field"><label for="signupEmail">Email</label><input id="signupEmail" type="email" autocomplete="email" required></div><div class="field"><label for="signupPassword">Password</label><input id="signupPassword" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="roomId">Ruangan / Unit Utama</label><select id="roomId" required><option value="">Memuat daftar ruangan…</option></select><div class="helper">Unit ini menjadi konteks awal akun dan dapat disesuaikan administrator.</div></div><button class="btn primary" style="width:100%" id="signupSubmit" type="submit">Buat Akun</button></form><div class="msg" id="signupMsg"></div><div class="switch"><button class="link" id="toLogin" type="button">← Kembali ke Login</button></div></section></main>';$('signupForm').addEventListener('submit',e=>{e.preventDefault();signUp()});$('toLogin').onclick=loginPage;loadRoomsForSignup()}async function loadRoomsForSignup(){try{const r=await sb.from('master_rooms').select('id,code,name').eq('is_active',true).order('sort_order');if(r.error)throw r.error;const sel=$('roomId');sel.innerHTML='<option value="">Pilih ruangan</option>'+r.data.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('')}catch(e){$('signupMsg').textContent='Daftar ruangan gagal dimuat: '+(e.message||e)}}async function signUp(){const b=$('signupSubmit'),m=$('signupMsg');b.disabled=true;m.textContent='';m.className='msg';try{const fullName=$('fullName').value.trim(),email=$('signupEmail').value.trim(),password=$('signupPassword').value,roomId=$('roomId').value;if(password.length<8)throw Error('Password minimal 8 karakter.');if(!roomId)throw Error('Silakan pilih ruangan/unit utama.');const r=await sb.auth.signUp({email,password,options:{data:{full_name:fullName,primary_room_id:Number(roomId)}}});if(r.error)throw r.error;m.className='msg good';m.textContent=r.data.session?'Akun berhasil dibuat. Administrator perlu mengaktifkan role dan akun.':'Akun dibuat. Periksa email bila verifikasi email diaktifkan.';setTimeout(loginPage,1800)}catch(e){m.textContent=e.message||'Pendaftaran gagal.'}finally{b.disabled=false}}async function loadProfile(){const user=session.user;const r=await sb.from('user_profiles').select('user_id,full_name,email,primary_room_id,role_id,is_active').eq('user_id',user.id).maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('Profil AUREKA belum tersedia. Silakan tunggu administrator memetakan akun Anda.');if(r.data.is_active===false)throw Error('Akun belum aktif. Hubungi administrator.');profile=r.data;if(profile.primary_room_id){const q=await sb.from('master_rooms').select('id,code,name').eq('id',profile.primary_room_id).maybeSingle();if(q.error)throw q.error;room=q.data}}function workspacePage(){const nav=MODULES.map(m=>'<button data-nav="'+m.id+'" class="'+(m.id===active?'active':'')+'">'+m.icon+' &nbsp;'+m.name+'</button>').join('');$('app').innerHTML='<div class="workspace"><aside class="side" id="side"><div class="brand">'+logo()+'<div><b>AUREKA</b><small>Hospital Quality Intelligence</small></div></div><div class="nav-title">Workspace</div><nav class="nav">'+nav+'</nav><div class="user-box"><b>'+esc(profile?.full_name||session.user.email)+'</b><span>'+esc(room?.name||'Unit belum dipetakan')+'</span></div></aside><main class="work"><div class="head"><div><h1 id="pageTitle">Overview</h1><p>'+esc(profile?.full_name||session.user.email)+'</p></div><div class="action"><button class="mobile" id="menuBtn" type="button">☰</button><button class="btn secondary" id="logoutBtn" type="button">Logout</button></div></div><div id="workspaceContent"></div></main></div>';$('logoutBtn').onclick=async()=>{await sb.auth.signOut();session=null;profile=null;room=null;active='home';publicPage()};$('menuBtn').onclick=()=>$('side').classList.toggle('open');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{active=b.dataset.nav;document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x===b));renderWorkspace()});renderWorkspace()}function renderWorkspace(){const m=MODULES.find(x=>x.id===active);$('pageTitle').textContent=m.name;if(active==='home'){renderOverview();return}const children={quality:['Audit Indikator Mutu','Audit Clinical Pathway','Audit Klinis dan Kematian','Audit OPPE'],safety:['Insiden Keselamatan Pasien','Investigasi / Root Cause Analysis (RCA)','Survey Budaya Keselamatan Pasien'],risk:['Risk Register','FMEA'],analytics:['Statistical Analysis','Data Extraction → XLSX'],settings:['Pengaturan Umum','Manajemen User / PIC Pelaporan']}[active]||[];$('workspaceContent').innerHTML='<div class="section"><h2>'+m.name+'</h2></div><section class="modules">'+children.map(x=>'<div class="module-card"><b>'+x+'</b><span>Container aktif. Business logic akan dibangun setelah desain modul disepakati.</span></div>').join('')+'</section><div class="section"><h2>Unit Context</h2></div><div class="card"><div class="label">Unit / Ruangan</div><div class="value" style="font-size:21px">'+esc(room?.name||'Belum dipetakan')+'</div><div class="sub">Dashboard operasional dibatasi berdasarkan unit dan permission user.</div></div>'}function renderOverview(){$('workspaceContent').innerHTML='<div class="section"><h2>Personal Overview</h2></div><section class="grid g4"><div class="card"><div class="label">Unit</div><div class="value" style="font-size:18px">'+esc(room?.name||'Belum dipetakan')+'</div><div class="sub">Unit utama user</div></div><div class="card"><div class="label">Laporan terakhir</div><div class="value">—</div><div class="sub">Menunggu modul audit</div></div><div class="card"><div class="label">Kepatuhan mutu</div><div class="value">—</div><div class="sub">Belum ada data audit</div></div><div class="card"><div class="label">Action Required</div><div class="value">0</div><div class="sub">Clean rebuild baseline</div></div></section><div class="section"><h2>Workspace Modules</h2></div><section class="modules">'+MODULES.filter(x=>x.id!=='home').map(m=>'<button class="module-card" data-fast="'+m.id+'"><b>'+m.name+'</b><span>'+m.desc+'</span></button>').join('')+'</section>';document.querySelectorAll('[data-fast]').forEach(b=>b.onclick=()=>{active=b.dataset.fast;document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===active));renderWorkspace()})}async function boot(){const r=await sb.auth.getSession();if(r.data.session){session=r.data.session;try{await loadProfile();workspacePage()}catch(e){await sb.auth.signOut();publicPage()}}else publicPage();sb.auth.onAuthStateChange((_event,s)=>{session=s})}boot();</script></body></html>
