<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUREKA — Hospital Quality Intelligence</title><meta name="description" content="AUREKA — Advanced Unified Repository for Excellence, Quality & Analytics"><style>:root{--g:#0f7d57;--g2:#0a4f3a;--ink:#131722;--m:#697386;--l:#e7eaf0;--bg:#f6f7fb;--b:#2457d6;--d:#a51f2a;--good:#126346}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}button,input{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:30;height:72px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#ffffffec;backdrop-filter:blur(18px);border-bottom:1px solid var(--l)}.brand{display:flex;align-items:center;gap:10px}.brand img{width:38px;height:38px;object-fit:contain}.brand b{display:block;font-size:16px}.brand small{display:block;margin-top:2px;color:var(--m);font-size:10px}.btn{border:0;border-radius:11px;padding:11px 15px;background:#151922;color:#fff;font-weight:750}.btn.primary{background:var(--g)}.btn.secondary{background:#eef0f3;color:var(--ink)}.btn:disabled{opacity:.55;cursor:not-allowed}.content{max-width:1260px;margin:auto;padding:34px}.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:32px;align-items:center;padding:30px 0 42px}.eyebrow{font-size:10px;letter-spacing:.12em;font-weight:800;color:#6d7481}.acronym{margin:10px 0 12px;font-size:12px;line-height:1.5;color:#176b50}.hero h1{font-size:54px;line-height:1.04;letter-spacing:-.055em;margin:12px 0}.hero h1 em{font-style:normal;color:var(--g)}.hero p{max-width:820px;color:var(--m);font-size:16px;line-height:1.75;margin:0 0 18px}.points{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 22px}.points span,.pill{padding:7px 10px;border-radius:999px;background:#eaf4ef;color:#176b50;font-size:10px;font-weight:800}.hero-card{min-height:275px;border-radius:28px;background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;box-shadow:0 24px 60px #0a4f3a2b;text-align:center}.hero-card img{width:92px;height:92px;object-fit:contain;filter:brightness(0) invert(1)}.hero-card strong{font-size:31px}.hero-card span{font-size:12px;opacity:.8}.section{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}.section h2{font-size:17px;margin:0}.grid,.modules{display:grid;gap:13px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.modules{grid-template-columns:repeat(3,minmax(0,1fr))}.card,.module-card{background:#fff;border:1px solid var(--l);border-radius:16px;padding:17px}.module-card{text-align:left;transition:.15s}.module-card:hover{transform:translateY(-2px);box-shadow:0 12px 28px #0000000a}.module-card b{display:block;font-size:14px}.module-card span{display:block;margin-top:6px;color:var(--m);font-size:11px;line-height:1.5}.label{font-size:10px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}.value{font-size:28px;font-weight:850;margin-top:5px}.sub{font-size:11px;color:var(--m);margin-top:4px;line-height:1.45}.notice{padding:14px 16px;border-radius:13px;background:#fff;border:1px solid var(--l);font-size:12px;line-height:1.55}.notice.good{background:#effaf4;border-color:#cde8d9;color:var(--good)}.notice.bad{background:#fff0f3;border-color:#f2c9d2;color:var(--d)}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(180deg,#f8fbf9,#f1f4fa)}.login-card{width:min(420px,94vw);background:#fff;border:1px solid var(--l);border-radius:24px;padding:30px;box-shadow:0 24px 70px #00000012}.login-logo{width:70px;height:70px;margin:0 auto 12px;display:grid;place-items:center}.login-logo img{width:60px;height:60px;object-fit:contain}.login-card h1{text-align:center;font-size:24px;margin:0}.login-card p{text-align:center;color:var(--m);font-size:12px;line-height:1.55}.field{margin:15px 0}.field label{display:block;margin-bottom:6px;font-size:12px;font-weight:750}.field input{display:block;width:100%;height:44px;padding:0 12px;border:1px solid #d8dce4;border-radius:10px;background:#fff;outline:none}.field input:focus{border-color:#6b7de0;box-shadow:0 0 0 3px #2457d61a}.msg{min-height:20px;margin-top:9px;font-size:11px;color:var(--d)}.msg.good{color:var(--good)}.switch{text-align:center;color:var(--m);font-size:11px;margin-top:13px}.link{border:0;background:none;color:var(--b);padding:0;font-weight:750}.workspace{min-height:100vh;display:grid;grid-template-columns:270px 1fr}.side{background:#fff;border-right:1px solid var(--l);padding:19px;position:sticky;top:0;height:100vh}.side .brand{margin-bottom:26px}.nav-title{font-size:9px;color:#9298a4;text-transform:uppercase;letter-spacing:.12em;margin:12px 0 7px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#394151;text-align:left;padding:10px 11px;border-radius:10px;font-size:11px}.nav button.active,.nav button:hover{background:#edf5f1;color:#126346;font-weight:750}.user-box{margin-top:22px;padding:12px;border:1px solid var(--l);border-radius:14px;background:#fafbfc}.user-box b{display:block;font-size:12px}.user-box span{display:block;color:var(--m);font-size:10px;margin-top:3px}.work{padding:24px 28px;min-width:0}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.head h1{margin:0;font-size:27px}.head p{margin:5px 0 0;color:var(--m);font-size:11px}.action{display:flex;gap:8px}.mobile{display:none;border:0;background:#eef0f3;border-radius:9px;padding:9px}@media(max-width:950px){.hero{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.modules{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.content{padding:22px 14px}.hero h1{font-size:38px}.g4,.modules{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.side{position:fixed;left:-290px;width:270px;z-index:40;transition:left .2s}.side.open{left:0}.mobile{display:block}.work{padding:18px 14px}.head h1{font-size:21px}}</style></head><body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>'use strict';const CONFIG={url:'https://ktukmjscopggkzrkgnzp.supabase.co',key:'sb_publishable_6NWrr2xGApSApIjQ0irtvA_U05ZQlFX'},OFFICIAL_LOGO='https://rsudssma.pontianak.go.id/storage/settings/October2023/8ODy7bT72ice4vVuuC9d.png',sb=supabase.createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const MODULES=[{id:'home',name:'Overview',desc:'Capaian keseluruhan dan dashboard unit',icon:'⌂'},{id:'quality',name:'Indikator Mutu',desc:'Audit indikator, Clinical Pathway, klinis/kematian, OPPE',icon:'◈'},{id:'safety',name:'Keselamatan Pasien',desc:'IKP, investigasi/RCA, budaya keselamatan',icon:'✚'},{id:'risk',name:'Manajemen Risiko',desc:'Risk Register dan FMEA',icon:'△'},{id:'analytics',name:'Metadata dan Statistik',desc:'Uji statistik dan Data Extraction XLSX',icon:'∑'},{id:'settings',name:'Pengaturan',desc:'Pengaturan umum dan manajemen PIC',icon:'⚙'}];let session=null,profile=null,room=null,active='home';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function logo(c=''){return '<div class="'+c+'"><img src="/assets/logo_rsud.png" alt="Logo RSUD Sultan Syarif Mohamad Alkadrie" onerror="this.onerror=null;this.src=\''+OFFICIAL_LOGO+'\'"></div>'}function publicPage(){$('app').innerHTML='<div class="top"><div class="brand">'+logo()+'<div><b>AUREKA</b><small>Hospital Quality Intelligence</small></div></div><button class="btn primary" id="loginBtn">Login Workspace</button></div><main class="content"><section class="hero"><div><div class="eyebrow">UPT RSUD SULTAN SYARIF MOHAMAD ALKADRIE</div><div class="acronym">AUREKA = <strong>Advanced Unified Repository for Excellence, Quality &amp; Analytics</strong></div><h1>Mutu rumah sakit,<br><em>terlihat dalam data.</em></h1><p>AUREKA mengintegrasikan mutu, keselamatan pasien, manajemen risiko, analitik dan reporting dalam satu workspace. Satu fondasi untuk mengubah laporan menjadi informasi, informasi menjadi insight, dan insight menjadi perbaikan.</p><div class="points"><span>Quality Intelligence</span><span>Patient Safety</span><span>Risk Intelligence</span><span>Clinical Analytics</span><span>Executive Reporting</span></div><button class="btn primary" id="heroLogin">Masuk ke Workspace</button></div><div class="hero-card">'+logo()+'<strong>AUREKA</strong><span>Hospital Quality Intelligence</span></div></section><div class="section"><h2>System Pulse</h2><span class="pill">PUBLIC OVERVIEW</span></div><section class="grid g4"><div class="card"><div class="label">Ruangan terdaftar</div><div class="value">37</div><div class="sub">Master unit rumah sakit</div></div><div class="card"><div class="label">Modul terintegrasi</div><div class="value">6</div><div class="sub">Mutu, keselamatan, risiko, analitik &amp; pengaturan</div></div><div class="card"><div class="label">Risiko teregistrasi</div><div class="value">0</div><div class="sub">Baseline baru — menunggu data pertama</div></div><div class="card"><div class="label">Status platform</div><div class="value" id="backend">…</div><div class="sub">Supabase clean rebuild</div></div></section><div class="section"><h2>Quality Workspace</h2><span class="pill">READY</span></div><section class="modules">'+MODULES.map(m=>'<button class="module-card" data-open="'+m.id+'"><b>'+m.name+'</b><span>'+m.desc+'</span></button>').join('')+'</section><div class="section"><h2>Status Platform</h2></div><div class="notice" id="status">Menghubungkan ke Supabase…</div></main>';$('loginBtn').onclick=loginPage;$('heroLogin').onclick=loginPage;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=loginPage);checkBackend()}async function checkBackend(){try{const r=await sb.auth.getSession();if(r.error)throw r.error;$('backend').textContent='OK';$('status').className='notice good';$('status').innerHTML='<b>Connected</b> — antarmuka siap terhubung ke backend AUREKA.'}catch(e){$('backend').textContent='—';$('status').className='notice bad';$('status').innerHTML='<b>Backend belum tersambung.</b><br>'+esc(e.message||e)}}function loginPage(){$('app').innerHTML='<main class="login"><section class="login-card">'+logo('login-logo')+'<h1>AUREKA Workspace</h1><p>Masuk menggunakan akun AUREKA sesuai role dan unit yang diberikan administrator.</p><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%" id="loginSubmit" type="submit">Masuk</button></form><div class="msg" id="loginMsg"></div><div class="switch">Belum punya akun? <button class="link" id="signupLink" type="button">Daftar akun baru</button></div><div class="switch"><button class="link" id="backLink" type="button">← Dashboard publik</button></div></section></main>';$('loginForm').addEventListener('submit',e=>{e.preventDefault();signIn()});$('signupLink').onclick=signupPage;$('backLink').onclick=publicPage}async function signIn(){const b=$('loginSubmit'),m=$('loginMsg');b.disabled=true;m.textContent='';try{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;session=r.data.session;await loadProfile();workspacePage()}catch(e){m.textContent=e.message||'Login gagal.'}finally{b.disabled=false}}function signupPage(){$('app').innerHTML='<main class="login"><section class="login-card">'+logo('login-logo')+'<h1>Daftar Akun AUREKA</h1><p>Registrasi awal untuk calon PIC pelaporan. Profil unit dan role akan dikonfigurasi administrator.</p><form id="signupForm"><div class="field"><label for="fullName">Nama Lengkap</label><input id="fullName" type="text" autocomplete="name" required></div><div class="field"><label for="signupEmail">Email</label><input id="signupEmail" type="email" autocomplete="email" required></div><div class="field"><label for="signupPassword">Password</label><input id="signupPassword" type="password" autocomplete="new-password" minlength="8" required></div><button class="btn primary" style="width:100%" id="signupSubmit" type="submit">Buat Akun</button></form><div class="msg" id="signupMsg"></div><div class="switch"><button class="link" id="toLogin" type="button">← Kembali ke Login</button></div></section></main>';$('signupForm').addEventListener('submit',e=>{e.preventDefault();signUp()});$('toLogin').onclick=loginPage}async function signUp(){const b=$('signupSubmit'),m=$('signupMsg');b.disabled=true;m.textContent='';m.className='msg';try{const fullName=$('fullName').value.trim(),email=$('signupEmail').value.trim(),password=$('signupPassword').value;if(password.length<8)throw Error('Password minimal 8 karakter.');const r=await sb.auth.signUp({email,password,options:{data:{full_name:fullName}}});if(r.error)throw r.error;m.className='msg good';m.textContent=r.data.session?'Akun berhasil dibuat. Administrator perlu memetakan role dan unit sebelum workspace digunakan.':'Akun dibuat. Periksa email bila verifikasi email diaktifkan.';setTimeout(loginPage,1800)}catch(e){m.textContent=e.message||'Pendaftaran gagal.'}finally{b.disabled=false}}async function loadProfile(){const r=await sb.from('user_profiles').select('user_id,full_name,email,primary_room_id,role_id,is_active').eq('user_id',session.user.id).maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('Profil AUREKA belum tersedia. Silakan tunggu administrator memetakan akun Anda.');if(r.data.is_active===false)throw Error('Akun belum aktif. Hubungi administrator.');profile=r.data;if(profile.primary_room_id){const q=await sb.from('master_rooms').select('id,code,name').eq('id',profile.primary_room_id).maybeSingle();if(q.error)throw q.error;room=q.data}}function workspacePage(){const nav=MODULES.map(m=>'<button data-nav="'+m.id+'" class="'+(m.id===active?'active':'')+'">'+m.icon+' &nbsp;'+m.name+'</button>').join('');$('app').innerHTML='<div class="workspace"><aside class="side" id="side"><div class="brand">'+logo()+'<div><b>AUREKA</b><small>Hospital Quality Intelligence</small></div></div><div class="nav-title">Workspace</div><nav class="nav">'+nav+'</nav><div class="user-box"><b>'+esc(profile?.full_name||session.user.email)+'</b><span>'+esc(room?.name||'Unit belum dipetakan')+'</span></div></aside><main class="work"><div class="head"><div><h1 id="pageTitle">Overview</h1><p>'+esc(profile?.full_name||session.user.email)+'</p></div><div class="action"><button class="mobile" id="menuBtn" type="button">☰</button><button class="btn secondary" id="logoutBtn" type="button">Logout</button></div></div><div id="workspaceContent"></div></main></div>';$('logoutBtn').onclick=async()=>{await sb.auth.signOut();session=null;profile=null;room=null;active='home';publicPage()};$('menuBtn').onclick=()=>$('side').classList.toggle('open');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{active=b.dataset.nav;document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x===b));renderWorkspace()});renderWorkspace()}function renderWorkspace(){const m=MODULES.find(x=>x.id===active);$('pageTitle').textContent=m.name;if(active==='home'){renderOverview();return}const children={quality:['Audit Indikator Mutu','Audit Clinical Pathway','Audit Klinis dan Kematian','Audit OPPE'],safety:['Insiden Keselamatan Pasien','Investigasi / Root Cause Analysis (RCA)','Survey Budaya Keselamatan Pasien'],risk:['Risk Register','FMEA'],analytics:['Statistical Analysis','Data Extraction → XLSX'],settings:['Pengaturan Umum','Manajemen User / PIC Pelaporan']}[active]||[];$('workspaceContent').innerHTML='<div class="section"><h2>'+m.name+'</h2><span class="pill">READY FOR DESIGN</span></div><section class="modules">'+children.map(x=>'<div class="module-card"><b>'+x+'</b><span>Container aktif. Business logic akan dibangun setelah desain modul disepakati.</span></div>').join('')+'</section><div class="section"><h2>Unit Context</h2></div><div class="card"><div class="label">Unit / Ruangan</div><div class="value" style="font-size:21px">'+esc(room?.name||'Belum dipetakan')+'</div><div class="sub">Dashboard operasional dibatasi berdasarkan unit dan permission user.</div></div>'}function renderOverview(){$('workspaceContent').innerHTML='<div class="section"><h2>Personal Overview</h2><span class="pill">ROLE / UNIT BASED</span></div><section class="grid g4"><div class="card"><div class="label">Unit</div><div class="value" style="font-size:18px">'+esc(room?.name||'Belum dipetakan')+'</div><div class="sub">Unit utama user</div></div><div class="card"><div class="label">Laporan terakhir</div><div class="value">—</div><div class="sub">Menunggu modul audit</div></div><div class="card"><div class="label">Kepatuhan mutu</div><div class="value">—</div><div class="sub">Belum ada data audit</div></div><div class="card"><div class="label">Action Required</div><div class="value">0</div><div class="sub">Clean rebuild baseline</div></div></section><div class="section"><h2>Workspace Modules</h2></div><section class="modules">'+MODULES.filter(x=>x.id!=='home').map(m=>'<button class="module-card" data-fast="'+m.id+'"><b>'+m.name+'</b><span>'+m.desc+'</span></button>').join('')+'</section>';document.querySelectorAll('[data-fast]').forEach(b=>b.onclick=()=>{active=b.dataset.fast;document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===active));renderWorkspace()})}async function boot(){const r=await sb.auth.getSession();if(r.data.session){session=r.data.session;try{await loadProfile();workspacePage()}catch(e){await sb.auth.signOut();publicPage()}}else publicPage();sb.auth.onAuthStateChange((_event,s)=>{session=s})}boot();</script></body></html>
