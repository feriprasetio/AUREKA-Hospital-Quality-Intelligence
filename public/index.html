.content{max-width:1420px;margin:auto;padding:22px 28px 70px}.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(460px,.95fr);gap:38px;align-items:center;padding:44px 0 58px}.eyebrow{font-size:10px;letter-spacing:.16em;font-weight:800;color:#7a8580}.acronym{margin:14px 0 6px;color:#17654d;font-size:12px}.hero h1{font-size:clamp(48px,5vw,72px);line-height:.98;letter-spacing:-.06em;margin:12px 0 18px}.hero h1 em{font-style:normal;background:linear-gradient(135deg,#0d7958,#1eab79 65%,#0a5b44);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{max-width:780px;color:var(--muted);font-size:16px;line-height:1.75;margin:0}.points{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 26px}.points span,.pill{padding:8px 11px;border-radius:999px;background:rgba(232,246,240,.88);border:1px solid rgba(15,118,86,.08);color:#12664b;font-size:10px;font-weight:800}.hero-actions{display:flex;gap:10px;flex-wrap:wrap}

.section{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:24px 0 13px}.section h2{font-size:19px;letter-spacing:-.03em;margin:0}.section p{margin:3px 0 0;color:var(--muted);font-size:11px}.grid,.modules{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.modules{grid-template-columns:repeat(3,minmax(0,1fr))}.card,.module-card{border-radius:22px;padding:20px}.card{position:relative;overflow:hidden}.card::after{content:"";position:absolute;width:160px;height:160px;right:-90px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,0));pointer-events:none}.label{font-size:10px;color:#87918d;text-transform:uppercase;letter-spacing:.1em}.value{font-size:30px;font-weight:850;letter-spacing:-.04em;margin-top:6px}.sub{font-size:11px;color:var(--muted);line-height:1.5;margin-top:5px}.status-dot{display:inline-flex;align-items:center;gap:7px}.status-dot::before{content:"";width:7px;height:7px;border-radius:50%;background:#22b878;box-shadow:0 0 0 5px rgba(34,184,120,.10)}.module-card{position:relative;border:1px solid rgba(255,255,255,.72);background:rgba(255,255,255,.64);text-align:left;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease);box-shadow:0 10px 32px rgba(25,52,42,.06)}.module-card:hover{transform:translateY(-4px) scale(1.005);background:rgba(255,255,255,.80);box-shadow:0 20px 42px rgba(25,52,42,.11)}.module-card b{display:block;font-size:15px;letter-spacing:-.02em}.module-card span{display:block;margin-top:7px;color:var(--muted);font-size:11px;line-height:1.55}.module-icon{width:42px;height:42px;display:grid;place-items:center;margin-bottom:15px;border-radius:14px;background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(236,244,240,.8));border:1px solid rgba(16,32,24,.06);color:#12664b;box-shadow:0 8px 20px rgba(25,52,42,.06)}.module-icon svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.8;fill:none}

.workspace{min-height:100vh;display:grid;grid-template-columns:286px 1fr}.side{position:sticky;top:0;height:100vh;padding:18px;background:rgba(247,250,248,.72);border-right:1px solid rgba(16,32,24,.08);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%)}.side .brand{padding:4px 4px 20px}.nav-title{font-size:9px;color:#8b9691;text-transform:uppercase;letter-spacing:.13em;margin:12px 8px 8px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#4d5954;text-align:left;padding:11px 12px;border-radius:14px;font-size:11px;transition:.2s var(--ease)}.nav button:hover{background:rgba(255,255,255,.58);color:#12664b;transform:translateX(2px)}.nav button.active{background:rgba(255,255,255,.76);color:#0f7656;font-weight:800;box-shadow:0 6px 20px rgba(25,52,42,.06)}.nav-icon{width:18px;display:grid;place-items:center}.nav-icon svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.8;fill:none}.user-box{margin-top:22px;padding:13px;border-radius:18px}.user-box b{display:block;font-size:12px}.user-box span{display:block;color:var(--muted);font-size:10px;margin-top:4px;line-height:1.45}.work{padding:24px 30px;min-width:0}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.head h1{margin:0;font-size:30px;letter-spacing:-.045em}.head p{margin:5px 0 0;color:var(--muted);font-size:11px}.action{display:flex;gap:8px}.mobile{display:none;border:1px solid rgba(16,32,24,.08);background:rgba(255,255,255,.7);border-radius:12px;padding:9px}.workspace .card,.workspace .module-card{background:rgba(255,255,255,.62)}
.float{animation:float 7s ease-in-out infinite}.fade-up{animation:fadeUp .6s var(--ease) both}.delay-1{animation-delay:.08s}.delay-2{animation-delay:.16s}.delay-3{animation-delay:.24s}@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-10px,0)}}
@media(max-width:1050px){.hero{grid-template-columns:1fr}.hero-card{min-height:340px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.modules{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.top{margin:8px 8px 0;height:68px}.content{padding:18px 14px 50px}.hero{padding:28px 0 44px;gap:24px}.hero h1{font-size:45px}.hero-card{min-height:320px;border-radius:28px;padding:28px}.hero-card .hero-mark{font-size:72px}.g4,.modules{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.side{position:fixed;left:-305px;width:286px;z-index:60;transition:left .25s var(--ease)}.side.open{left:0}.mobile{display:block}.work{padding:18px 14px}.head h1{font-size:23px}.login-card{padding:28px 22px;border-radius:28px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<script>
'use strict';
const CONFIG={url:'https://ktukmjscopggkzrkgnzp.supabase.co',key:'sb_publishable_6NWrr2xGApSApIjQ0irtvA_U05ZQlFX'};
const OFFICIAL_LOGO='https://rsudssma.pontianak.go.id/storage/settings/October2023/8ODy7bT72ice4vVuuC9d.png';

const ROOMS=[['INF_PENGADUAN','Informasi dan Pengaduan'],['INFOTEK','Informatika dan Teknologi'],['AMB','Instalasi Ambulance'],['IBS','Instalasi Bedah Sentral'],['FARM','Instalasi Farmasi'],['IGD','Instalasi Gawat Darurat'],['GIZI','Instalasi Gizi'],['HD','Instalasi Hemodialisis'],['LAB','Instalasi Laboratorium'],['RAD','Instalasi Radiologi'],['IRJ','Instalasi Rawat Jalan'],['REHAB','Instalasi Rehab Medik'],['RM','Instalasi Rekam Medis'],['ICU_HCU','Intensive Care Unit & High Care Unit'],['KOMED','Komite Medik'],['PPI','Komite Pencegahan dan Pengendalian Infeksi'],['MRS','Manajemen rumah Sakit'],['NICU_PHDU','Neonatal Intensive Care Unit & Pediatrics High Dependency Unit'],['NIFAS_OBGYN','Nifas Obstetrics & Gynecology'],['PERINATOLOGI','Perinatology & Neonatology'],['PKRS','Promosi Kesehatan Rumah Sakit'],['RI_ANAK','Rawat Inap Anak'],['RI_BEDAH','Rawat Inap Bedah'],['RI_ISOLASI','Rawat Inap Isolasi'],['RI_IPD','Rawat Inap Penyakit Dalam'],['RI_SARAF','Rawat Inap Saraf'],['RI_VIP','Rawat Inap VIP'],['SPI','Satuan Pengawas Intern'],['TIM_INVESTIGASI','Tim Investigasi'],['TIM_PENDIDIKAN','Tim Koordinasi Pendidikan'],['TIM_HIV','Tim Pelayanan Human Immunodeficiency Virus'],['TIM_KB_RS','Tim Pelayanan Keluarga Berencana Rumah Sakit'],['PONEK','Tim Pelayanan Obstetri Neonatal Emergensi Komprehensif'],['ONKOLOGI','Tim Pelayanan Onkologi'],['PPRA','Tim Pencegahan Resistensi Antimikroba'],['TPKK','Tim Peningkatan Kinerja Klinis'],['VERLOS','Verlos Kamer']];
const ICONS={home:`<svg viewBox="0 0 24 24"><path d="M3 10.7 12 3l9 7.7"/><path d="M5.5 10v10h13V10"/><path d="M9.5 20v-6h5v6"/></svg>`,quality:`<svg viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.4 3.1 7.6 7.5 9.5 4.4-1.9 7.5-5.1 7.5-9.5V6L12 3Z"/><path d="m8.8 12 2.1 2.1 4.4-4.4"/></svg>`,safety:`<svg viewBox="0 0 24 24"><path d="M12 21s7-3.2 7-9.2V5.8L12 3 5 5.8v6C5 17.8 12 21 12 21Z"/><path d="M12 8v7M8.5 11.5h7"/></svg>`,risk:`<svg viewBox="0 0 24 24"><path d="m12 4 8 15H4L12 4Z"/><path d="M12 9v5M12 17.1v.2"/></svg>`,analytics:`<svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="m7 15 3-3 3 2 5-7"/></svg>`,settings:`<svg viewBox="0 0 24 24"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z"/><path d="m19.4 15 .1.1-1.7 3-2-.8-1.7 1-.3 2.1h-3.5L10 18.3a8.6 8.6 0 0 1-1.7-1l-2 .8-1.7-3 .1-.1 1.7-1.4a8.2 8.2 0 0 1 0-2l-1.7-1.4-.1-.1 1.7-3 2 .8a8.6 8.6 0 0 1 1.7-1L10.3 4h3.5l.3 2.1a8.6 8.6 0 0 1 1.7 1l2-.8 1.7 3-.1.1-1.7 1.4a8.2 8.2 0 0 1 0 2l1.7 1.4Z"/></svg>`};
const MODULES=[{id:'home',name:'Overview',desc:'Capaian keseluruhan dan dashboard unit',icon:ICONS.home},{id:'quality',name:'Indikator Mutu',desc:'Audit indikator, Clinical Pathway, klinis/kematian, OPPE',icon:ICONS.quality},{id:'safety',name:'Keselamatan Pasien',desc:'IKP, investigasi/RCA, budaya keselamatan',icon:ICONS.safety},{id:'risk',name:'Manajemen Risiko',desc:'Risk Register dan FMEA',icon:ICONS.risk},{id:'analytics',name:'Metadata dan Statistik',desc:'Uji statistik dan Data Extraction XLSX',icon:ICONS.analytics},{id:'settings',name:'Pengaturan',desc:'Pengaturan umum dan manajemen PIC',icon:ICONS.settings}];
let session=null,profile=null,room=null,role=null,active='home';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function logo(c=''){return `<div class="${c}"><img src="/assets/logo_rsud.png" alt="Logo RSUD Sultan Syarif Mohamad Alkadrie" onerror="this.onerror=null;this.src='${OFFICIAL_LOGO}'"></div>`}
function publicPage(){$('app').innerHTML=`<div class="top glass"><div class="brand">${logo()}<div><b>AUREKA</b><small>Hospital Quality Intelligence</small></div></div><button class="btn primary" id="loginBtn">Login Workspace</button></div><main class="content"><section class="hero fade-up"><div><div class="eyebrow">UPT RSUD SULTAN SYARIF MOHAMAD ALKADRIE</div><div class="acronym">AUREKA = <strong>Alkadrie Unified Risk, Evaluation, Quality &amp; Analytics</strong></div><h1>Mutu rumah sakit,<br><em>terlihat dalam data.</em></h1><p>AUREKA menyatukan mutu, keselamatan pasien, manajemen risiko, analitik dan reporting dalam satu pengalaman kerja yang tenang, cepat dan terukur.</p><div class="points"><span>Quality Intelligence</span><span>Patient Safety</span><span>Risk Intelligence</span><span>Clinical Analytics</span><span>Executive Reporting</span></div><div class="hero-actions"><button class="btn primary" id="heroLogin">Masuk ke Workspace</button><button class="btn secondary" id="exploreBtn">Lihat Modul</button></div></div><div class="hero-card float"><div class="hero-mark">AUREKA</div><div class="hero-sub">Alkadrie Unified Risk, Evaluation, Quality &amp; Analytics</div><div class="hero-caption">Hospital Quality Intelligence</div></div></section><div class="section"><div><h2>System Pulse</h2><p>Ringkasan kesehatan dan kesiapan sistem AUREKA — tanpa metrik risiko modul.</p></div><span class="pill">PUBLIC OVERVIEW</span></div><section class="grid g4"><div class="card glass fade-up"><div class="label">Ruangan aktif</div><div class="value">37</div><div class="sub">Master unit terhubung</div></div><div class="card glass fade-up delay-1"><div class="label">Modul terintegrasi</div><div class="value">6</div><div class="sub">Workspace inti AUREKA</div></div><div class="card glass fade-up delay-2"><div class="label">Backend</div><div class="value status-dot" id="backend">…</div><div class="sub">Supabase project</div></div><div class="card glass fade-up delay-3"><div class="label">Authentication</div><div class="value" style="font-size:24px">Secure</div><div class="sub">Session persistence aktif</div></div></section><div class="section" id="modules"><div><h2>Workspace</h2><p>Setiap domain memiliki ruang kerja dan metriknya sendiri.</p></div><span class="pill">LIQUID GLASS UI</span></div><section class="modules">${MODULES.map((m,i)=>`<button class="module-card glass fade-up delay-${Math.min(i,3)}" data-open="${m.id}"><div class="module-icon">${m.icon}</div><b>${m.name}</b><span>${m.desc}</span></button>`).join('')}</section><div class="section"><div><h2>Status Platform</h2><p>Connectivity check terhadap backend AUREKA.</p></div></div><div class="notice glass" id="status">Menghubungkan ke Supabase…</div></main>`;$('loginBtn').onclick=loginPage;$('heroLogin').onclick=loginPage;$('exploreBtn').onclick=()=>document.getElementById('modules').scrollIntoView({behavior:'smooth'});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=loginPage);checkBackend()}
async function checkBackend(){try{const r=await sb.auth.getSession();if(r.error)throw r.error;$('backend').textContent='OK';$('status').className='notice good';$('status').innerHTML='<b>Connected</b> — backend AUREKA siap digunakan.'}catch(e){$('backend').textContent='—';$('status').className='notice bad';$('status').innerHTML='<b>Backend belum tersambung.</b><br>'+esc(e.message||e)}}
function loginPage(){$('app').innerHTML=`<main class="login"><section class="login-card glass-strong fade-up">${logo('login-logo')}<h1>AUREKA Workspace</h1><p>Masuk menggunakan akun AUREKA sesuai role dan unit yang diberikan administrator.</p><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" placeholder="nama@rsudssma.pontianak.go.id" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required></div><button class="btn primary" style="width:100%;margin-top:4px" id="loginSubmit" type="submit">Masuk</button></form><div class="msg" id="loginMsg"></div><div class="switch">Belum punya akun? <button class="link" id="signupLink" type="button">Daftar akun baru</button></div><div class="switch"><button class="link" id="backLink" type="button">← Dashboard publik</button></div></section></main>`;$('loginForm').addEventListener('submit',e=>{e.preventDefault();signIn()});$('signupLink').onclick=signupPage;$('backLink').onclick=publicPage}
async function signIn(){const b=$('loginSubmit'),m=$('loginMsg');b.disabled=true;m.textContent='';try{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;session=r.data.session;await loadProfile();workspacePage()}catch(e){m.textContent=e.message||'Login gagal.'}finally{b.disabled=false}}
function signupPage(){const opts=ROOMS.map(([code,name])=>`<option value="${code}">${esc(name)}</option>`).join('');$('app').innerHTML=`<main class="login"><section class="login-card glass-strong fade-up">${logo('login-logo')}<h1>Daftar Akun AUREKA</h1><p>Registrasi awal untuk PIC pelaporan. Pilih ruangan utama Anda; akun akan menunggu aktivasi administrator sebelum workspace dapat digunakan.</p><form id="signupForm"><div class="field"><label for="fullName">Nama Lengkap</label><input id="fullName" type="text" autocomplete="name" placeholder="Nama lengkap" required></div><div class="field"><label for="signupEmail">Email</label><input id="signupEmail" type="email" autocomplete="email" placeholder="nama@rsudssma.pontianak.go.id" required></div><div class="field"><label for="signupRoom">Ruangan / Unit Utama</label><select id="signupRoom" required><option value="">Pilih ruangan…</option>${opts}</select><div class="helper">Terdapat 37 ruangan/unit yang tersedia di master AUREKA.</div></div><div class="field"><label for="signupPassword">Password</label><input id="signupPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Minimal 8 karakter" required></div><div class="role-note">Akun self-registration dibuat sebagai <b>PIC Pelaporan</b> dalam status menunggu aktivasi.</div><button class="btn primary" style="width:100%;margin-top:12px" id="signupSubmit" type="submit">Buat Akun</button></form><div class="msg" id="signupMsg"></div><div class="switch"><button class="link" id="toLogin" type="button">← Kembali ke Login</button></div></section></main>`;$('signupForm').addEventListener('submit',e=>{e.preventDefault();signUp()});$('toLogin').onclick=loginPage}
async function signUp(){const b=$('signupSubmit'),m=$('signupMsg');b.disabled=true;m.textContent='';m.className='msg';try{const fullName=$('fullName').value.trim(),email=$('signupEmail').value.trim(),password=$('signupPassword').value,roomCode=$('signupRoom').value;if(!roomCode)throw Error('Silakan pilih ruangan/unit utama.');if(password.length<8)throw Error('Password minimal 8 karakter.');const roomRow=ROOMS.find(x=>x[0]===roomCode);const roomId=ROOMS.findIndex(x=>x[0]===roomCode)+1;const r=await sb.auth.signUp({email,password,options:{data:{full_name:fullName,primary_room_id:String(roomId),primary_room_code:roomCode,primary_room_name:roomRow?.[1]||''}}});if(r.error)throw r.error;m.className='msg good';m.textContent=r.data.session?'Akun berhasil dibuat. Status akun menunggu aktivasi administrator.':'Akun dibuat. Periksa email bila verifikasi email diaktifkan; setelah itu administrator perlu mengaktifkan akun.';setTimeout(loginPage,2200)}catch(e){m.textContent=e.message||'Pendaftaran gagal.'}finally{b.disabled=false}}
async function loadProfile(){const r=await sb.schema('aureka_system').from('user_profiles').select('user_id,full_name,email,primary_room_id,role_id,is_active').eq('user_id',session.user.id).maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error('Profil AUREKA belum tersedia. Silakan hubungi administrator.');if(r.data.is_active===false)throw Error('Akun belum aktif. Hubungi administrator untuk aktivasi.');profile=r.data;if(profile.role_id){const rr=await sb.schema('aureka_system').from('app_roles').select('id,code,name').eq('id',profile.role_id).maybeSingle();if(!rr.error)role=rr.data}if(profile.primary_room_id){const q=await sb.from('master_rooms').select('id,code,name').eq('id',profile.primary_room_id).maybeSingle();if(q.error)throw q.error;room=q.data}}
function workspacePage(){const nav=MODULES.map(m=>`<button data-nav="${m.id}" class="${m.id===active?'active':''}"><span class="nav-icon">${m.icon}</span>${m.name}</button>`).join('');$('app').innerHTML=`<div class="workspace"><aside class="side" id="side"><div class="brand">${logo()}<div><b>AUREKA</b><small>Hospital Quality Intelligence</small></div></div><div class="nav-title">Workspace</div><nav class="nav">${nav}</nav><div class="user-box glass"><b>${esc(profile?.full_name||session.user.email)}</b><span>${esc(role?.name||'Role belum terpetakan')} · ${esc(room?.name||'Unit belum dipetakan')}</span></div></aside><main class="work"><div class="head"><div><h1 id="pageTitle">Overview</h1><p>${esc(profile?.full_name||session.user.email)} · ${esc(role?.name||'AUREKA User')}</p></div><div class="action"><button class="mobile" id="menuBtn" type="button">☰</button><button class="btn secondary" id="logoutBtn" type="button">Logout</button></div></div><div id="workspaceContent"></div></main></div>`;$('logoutBtn').onclick=async()=>{await sb.auth.signOut();session=null;profile=null;room=null;role=null;active='home';publicPage()};$('menuBtn').onclick=()=>$('side').classList.toggle('open');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{active=b.dataset.nav;document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x===b));renderWorkspace()});renderWorkspace()}
function renderWorkspace(){const m=MODULES.find(x=>x.id===active);$('pageTitle').textContent=m.name;if(active==='home'){renderOverview();return}const children={quality:['Audit Indikator Mutu','Audit Clinical Pathway','Audit Klinis dan Kematian','Audit OPPE'],safety:['Insiden Keselamatan Pasien','Investigasi / Root Cause Analysis (RCA)','Survey Budaya Keselamatan Pasien'],risk:['Risk Register','FMEA'],analytics:['Statistical Analysis','Data Extraction → XLSX'],settings:['Pengaturan Umum','Manajemen User / PIC Pelaporan']}[active]||[];$('workspaceContent').innerHTML=`<div class="section"><div><h2>${m.name}</h2><p>Ruang kerja modul — data dan metrik dikelola pada domain ini.</p></div><span class="pill">READY FOR DESIGN</span></div><section class="modules">${children.map(x=>`<div class="module-card glass"><div class="module-icon">${m.icon}</div><b>${x}</b><span>Container aktif. Business logic akan dibangun setelah desain modul disepakati.</span></div>`).join('')}</section><div class="section"><div><h2>Unit Context</h2><p>Akses dibatasi berdasarkan role, unit dan permission.</p></div></div><div class="card glass"><div class="label">Unit / Ruangan</div><div class="value" style="font-size:21px">${esc(room?.name||'Belum dipetakan')}</div><div class="sub">${esc(role?.name||'Role belum dipetakan')}</div></div>`}
function renderOverview(){$('workspaceContent').innerHTML=`<div class="section"><div><h2>Personal Overview</h2><p>Ringkasan yang menyesuaikan role dan unit user.</p></div><span class="pill">ROLE / UNIT BASED</span></div><section class="grid g4"><div class="card glass"><div class="label">Unit</div><div class="value" style="font-size:18px">${esc(room?.name||'Belum dipetakan')}</div><div class="sub">Unit utama user</div></div><div class="card glass"><div class="label">Laporan terakhir</div><div class="value">—</div><div class="sub">Menunggu modul audit</div></div><div class="card glass"><div class="label">Kepatuhan mutu</div><div class="value">—</div><div class="sub">Belum ada data audit</div></div><div class="card glass"><div class="label">Action Required</div><div class="value">0</div><div class="sub">Clean rebuild baseline</div></div></section><div class="section"><div><h2>Workspace Modules</h2><p>Pilih domain untuk masuk ke ruang kerja terkait.</p></div></div><section class="modules">${MODULES.filter(x=>x.id!=='home').map(m=>`<button class="module-card glass" data-fast="${m.id}"><div class="module-icon">${m.icon}</div><b>${m.name}</b><span>${m.desc}</span></button>`).join('')}</section>`;document.querySelectorAll('[data-fast]').forEach(b=>b.onclick=()=>{active=b.dataset.fast;document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===active));renderWorkspace()})}
async function boot(){const r=await sb.auth.getSession();if(r.data.session){session=r.data.session;try{await loadProfile();workspacePage()}catch(e){await sb.auth.signOut();publicPage()}}else publicPage();sb.auth.onAuthStateChange((_event,s)=>{session=s})}
boot();
</script>
</body>
</html>
