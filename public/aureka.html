<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f5f7"><title>AUREKA — Hospital Quality Intelligence</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;--bg:#f5f5f7;--tx:#1d1d1f;--muted:#707078;--line:#00000012;--card:#ffffffd6;--blue:#0071e3;--green:#34c759;--red:#ff3b30;--orange:#ff9f0a;--purple:#7046c5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% -10%,#fff,transparent 32%),radial-gradient(circle at 90% 0,#e7ebff,transparent 30%),var(--bg);color:var(--tx)}button,input,select{font:inherit}button{cursor:pointer}.top,.head,.section,.action,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.top{position:sticky;top:0;z-index:20;padding:12px 22px;background:#f5f5f7dd;backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px}.brand b{font-size:17px}.brand small{display:block;font-size:9px;color:var(--muted)}.logo{width:44px;height:44px;border-radius:13px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain;padding:4px}.btn{border:0;border-radius:12px;padding:10px 15px;background:var(--blue);color:#fff;font-weight:700}.btn.secondary{background:#0000000b;color:var(--tx)}.content{max-width:1500px;margin:auto;padding:28px 24px}.hero{display:grid;grid-template-columns:1fr 300px;gap:30px;align-items:center;min-height:370px}.eyebrow,.label{font-size:9px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}.hero h1{font-size:55px;line-height:1;letter-spacing:-.06em;margin:10px 0}.hero h1 em{font-style:normal;color:#405bd5}.hero p,.sub{color:var(--muted);line-height:1.6}.orb{width:265px;height:265px;border-radius:65px;margin:auto;background:linear-gradient(145deg,#fff,#e1e7ff);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 30px 70px #002d781f}.orb .logo{width:125px;height:125px}.orb strong{font-size:28px}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid #fff;border-radius:20px;padding:18px;box-shadow:0 18px 50px #0000000d;backdrop-filter:blur(18px)}.value{font-size:30px;font-weight:800;margin-top:7px}.section{margin:24px 0 10px}.section h2{font-size:18px;margin:0}.pill,.tag{display:inline-block;padding:6px 9px;border-radius:999px;background:#eef0f5;color:#555;font-size:9px}.tag{border-radius:8px}.notice{padding:12px;border-radius:12px;font-size:11px;line-height:1.5}.good{background:#34c75916;color:#276b3a}.bad{background:#ff3b3014;color:#a51f18}.warn{background:#ff9f0a18;color:#8a5700}.ai{background:linear-gradient(135deg,#fff,#f4efff);border-color:#8e5cf633}.ai strong{color:var(--purple)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(450px,100%);padding:34px;border-radius:30px;background:#ffffffd8;box-shadow:0 30px 80px #00000020}.login-card h1{text-align:center;margin:0}.login-card p{text-align:center;font-size:11px;color:var(--muted)}.field{margin:12px 0}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.field input,.field select,.toolbar input,.toolbar select{width:100%;padding:11px;border:1px solid #d8d8df;border-radius:11px;background:#fff}.msg{min-height:20px;color:var(--red);font-size:10px;margin-top:8px}.switch{text-align:center;color:var(--muted);font-size:10px;margin-top:13px}.link{border:0;background:none;color:var(--blue);font-weight:700;font-size:10px}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:18px 13px;background:#f5f5f7c2;backdrop-filter:blur(22px);border-right:1px solid var(--line);overflow:auto}.side .brand{padding:0 8px 18px}.nav-title{font-size:8px;color:#999;text-transform:uppercase;letter-spacing:.12em;padding:12px 9px 5px}.nav{display:flex;flex-direction:column;gap:3px}.nav button{border:0;background:transparent;text-align:left;padding:10px;border-radius:11px;font-size:11px}.nav button:hover,.nav button.active{background:#0071e31a;color:var(--blue);font-weight:700}.nav .ico{display:inline-block;width:23px}.workspace{padding:22px 24px;min-width:0}.head h1{font-size:27px;margin:0}.head p{font-size:10px;color:var(--muted);margin:4px 0}.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.toolbar>*{max-width:390px;flex:1;min-width:180px}.table{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff}table{width:100%;border-collapse:collapse;min-width:650px;font-size:10px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:8px;color:var(--muted);text-transform:uppercase;background:#fafafa}.empty{text-align:center;padding:38px;color:var(--muted);font-size:11px}.list{display:flex;flex-direction:column;gap:7px}.row{padding:11px;border:1px solid var(--line);border-radius:11px}.queue{display:grid;grid-template-columns:10px 1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.qdot{width:8px;height:8px;border-radius:50%;background:var(--orange);margin-top:4px}.qdot.green{background:var(--green)}.bar{height:8px;border-radius:99px;background:#e9e9ee;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}.mobile{display:none;border:0;background:#0000000b;border-radius:10px;padding:9px}@media(max-width:950px){.hero{grid-template-columns:1fr}.orb{order:-1;width:220px;height:220px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.shell{grid-template-columns:1fr}.side{position:fixed;left:-280px;width:270px;z-index:50;transition:left .2s}.side.open{left:0}.workspace{padding:18px 14px}.g4,.g3,.g2{grid-template-columns:1fr}.hero h1{font-size:36px}.content{padding:22px 15px}.mobile{display:block}}</style></head><body><div id="root"></div><script>'use strict';const C={url:'https://fwgdbddrsstzjlyfeqzl.supabase.co',key:'sb_publishable_4vm2V7__x7aTTxYp7_rwLQ_m0Z1WZK9'};const OFFICIAL='https://rsudssma.pontianak.go.id/storage/settings/October2023/8ODy7bT72ice4vVuuC9d.png';let sb=null,identity=null,cache={};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function logo(cls){cls=cls||'logo';return '<div class="'+cls+'"><img src="/assets/logo_rsud.png" alt="Logo RSUD Sultan Syarif Mohamad Alkadrie" onerror="this.onerror=null;this.src=\''+OFFICIAL+'\'"></div>'}const NAV={home:['Overview','⌂'],mutu:['Indikator Mutu','◈'],safety:['Keselamatan Pasien','✚'],risk:['Manajemen Risiko','△'],report:['Report','▤'],settings:['Settings','⚙']};const DOMAINS={mutu:[['indicators','Audit Indikator Mutu'],['clinical_pathways','Audit Clinical Pathway'],['tpkk_activities','Audit Klinis'],['mortality_reviews','Audit Kematian'],['oppe_evaluations','Audit OPPE']],safety:[['incidents','Form IKP'],['rca_investigations','Form RCA'],['culture_survey_responses','Survey Budaya Keselamatan']],risk:[['risks','Risk Register'],['fmea_analyses','FMEA']]};const DATASETS={indicators:'Indikator Mutu',indicator_data_points:'Data Indikator',clinical_pathways:'Clinical Pathway',cp_compliance_records:'CP Compliance',cp_variance_records:'CP Variance',tpkk_activities:'Audit Klinis / TPKK',mortality_reviews:'Audit Kematian',oppe_evaluations:'OPPE',incidents:'IKP',rca_investigations:'RCA',culture_survey_responses:'Survey Budaya Keselamatan',risks:'Risk Register',risk_treatment_plans:'Risk Treatment',fmea_analyses:'FMEA',profiles:'Profiles',user_roles:'User Roles',audit_logs:'Audit Logs'};function admin(){return !!(identity&&identity.roles&&identity.roles.some(x=>['superadmin','admin','komite_pmkp'].includes(String(x.roles&&x.roles.nama_role||'').toLowerCase())))}function roleNames(){return identity&&identity.roles?identity.roles.map(x=>x.roles&&x.roles.nama_role).filter(Boolean).join(', ')||'PIC Unit':'PIC Unit'}function publicPage(){document.body.innerHTML='<div class="top"><div class="brand">'+logo()+'<div><b>AUREKA</b><small>Hospital Quality Intelligence</small></div></div><button class="btn" id="login">Login Workspace</button></div><main class="content"><section class="hero"><div><div class="eyebrow">UPT RSUD SULTAN SYARIF MOHAMAD ALKADRIE</div><h1>Mutu rumah sakit,<br><em>terlihat dalam data.</em></h1><p>AUREKA menghubungkan pengukuran mutu, audit klinis, keselamatan pasien, manajemen risiko, pekerjaan perbaikan, reporting dan intelligence manajemen dalam satu workspace.</p><button class="btn" id="heroLogin">Masuk ke Workspace</button></div><div class="orb">'+logo()+'<strong>AUREKA</strong><small class="sub">Quality Intelligence</small></div></section><div class="section"><h2>System Pulse</h2><span class="pill">PUBLIC SUMMARY</span></div><section class="grid g4" id="metrics"><div class="card"><div class="label">Indikator aktif</div><div class="value">…</div></div><div class="card"><div class="label">Risk Register</div><div class="value">…</div></div><div class="card"><div class="label">Clinical Pathway</div><div class="value">…</div></div><div class="card"><div class="label">Dokumen</div><div class="value">…</div></div></section><div class="section"><h2>Status Platform</h2></div><div class="card" id="status"><div class="empty">Menghubungkan ke Supabase…</div></div></main>';$('login').onclick=loginPage;$('heroLogin').onclick=loginPage;loadPublic()}async function loadPublic(){const fallback=()=>{document.querySelectorAll('#metrics .value').forEach(x=>x.textContent='—');$('status').innerHTML='<div class="notice good"><b>Connected</b> — Supabase aktif. Ringkasan publik akan tersedia setelah schema AUREKA dipasang.</div>'};try{const r=await sb.rpc('get_aureka_public_overview');if(r.error)throw r.error;const d=r.data||{};const vals=[d.indicators||0,d.risks||0,d.clinical_pathways||0,d.documents||0];const els=document.querySelectorAll('#metrics .value');for(let i=0;i<vals.length;i++)els[i].textContent=Number(vals[i]).toLocaleString('id-ID');$('status').innerHTML='<div class="notice good"><b>Connected</b> — public summary Supabase aktif.</div>'}catch(e){fallback()}}function loginPage(){document.body.innerHTML='<main class="login"><section class="login-card">'+logo('logo center')+'<h1>AUREKA Workspace</h1><p>Masuk menggunakan akun AUREKA.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" style="width:100%" id="go">Masuk</button><div class="msg" id="msg"></div><div class="switch">Belum punya akun? <button class="link" id="signup">Daftar</button></div><div class="switch"><button class="link" id="back">← Dashboard publik</button></div></section></main>';$('go').onclick=signIn;$('password').onkeydown=e=>e.key==='Enter'&&signIn();$('signup').onclick=signupPage;$('back').onclick=publicPage}async function signIn(){const m=$('msg'),b=$('go');m.textContent='';b.disabled=true;try{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)throw Error('Email dan password wajib diisi.');const r=await sb.auth.signInWithPassword({email:email,password:password});if(r.error)throw r.error;if(!r.data.session)throw Error('Session login tidak terbentuk.');await workspace()}catch(e){m.textContent=e.message||'Login gagal.'}finally{b.disabled=false}}async function signupPage(){let units=[];try{const r=await sb.rpc('get_signup_units');if(r.error)throw r.error;units=r.data||[]}catch{}let opts='<option value="">Pilih unit</option>';units.forEach(u=>opts+='<option value="'+esc(u.id)+'">'+esc(u.nama_unit)+'</option>');document.body.innerHTML='<main class="login"><section class="login-card">'+logo('logo center')+'<h1>Buat Akun</h1><p>Akun baru dibuat sebagai PIC unit.</p><div class="field"><label>Nama lengkap</label><input id="name"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Unit</label><select id="unit">'+opts+'</select></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8"></div><button class="btn" style="width:100%" id="go">Daftar</button><div class="msg" id="msg"></div><div class="switch"><button class="link" id="back">← Login</button></div></section></main>';$('go').onclick=doSignup;$('back').onclick=loginPage}async function doSignup(){try{const n=$('name').value.trim(),e=$('email').value.trim(),u=$('unit').value,p=$('password').value;if(!n||!e||!u||p.length<8)throw Error('Lengkapi nama, email, unit dan password minimal 8 karakter.');const r=await sb.auth.signUp({email:e,password:p,options:{data:{nama_lengkap:n,unit_id:u}}});if(r.error)throw r.error;$('msg').style.color='var(--green)';$('msg').textContent=r.data.session?'Akun berhasil dibuat.':'Akun dibuat; konfirmasi email jika diminta.'}catch(e){$('msg').textContent=e.message||'Pendaftaran gagal.'}}async function loadIdentity(){const u=await sb.auth.getUser();if(u.error||!u.data.user)throw Error('Session tidak ditemukan.');const p=await sb.from('profiles').select('nama_lengkap,gelar,unit_id').eq('id',u.data.user.id).maybeSingle();if(p.error)throw p.error;const r=await sb.from('user_roles').select('unit_id,roles(nama_role)').eq('user_id',u.data.user.id);if(r.error)throw r.error;const uid=p.data&&p.data.unit_id||(r.data&&r.data[0]&&r.data[0].unit_id);let un='';if(uid){const q=await sb.from('units').select('nama_unit').eq('id',uid).maybeSingle();if(q.error)throw q.error;un=q.data&&q.data.nama_unit||''}identity={user:u.data.user,profile:p.data,roles:r.data||[],unitId:uid,unitName:un}}async function workspace(){try{await loadIdentity();workspacePage()}catch(e){await sb.auth.signOut();loginPage();$('msg').textContent='Identitas akun belum lengkap: '+e.message}}function workspacePage(){let nav='';Object.entries(NAV).forEach(([k,v])=>nav+='<button data-p="'+k+'" class="'+(k==='home'?'active':'')+'"><span class="ico">'+v[1]+'</span>'+v[0]+'</button>');document.body.innerHTML='<div class="shell"><aside class="side" id="side"><div class="brand">'+logo()+'<div><b>AUREKA</b><small>Hospital Quality Intelligence</small></div></div><div class="nav-title">Workspace</div><nav class="nav">'+nav+'</nav><div class="section"><span class="sub">'+esc(identity.unitName||'Unit belum terpetakan')+'</span></div></aside><main class="workspace"><div class="head"><div><h1 id="title">Overview</h1><p>'+esc(identity.profile&&identity.profile.nama_lengkap||identity.user.email)+' · '+esc(roleNames())+'</p></div><div class="action"><button class="mobile" id="menu">☰</button><button class="btn secondary" id="logout">Logout</button></div></div><div id="content"></div></main></div>';document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.p);$('side').classList.remove('open')});$('menu').onclick=()=>$('side').classList.toggle('open');$('logout').onclick=async()=>{await sb.auth.signOut();publicPage()};render('home')}async function count(t){if(cache[t]!==undefined)return cache[t];const r=await sb.from(t).select('*',{count:'exact',head:true});if(r.error)throw r.error;cache[t]=r.count||0;return cache[t]}async function render(p){$('title').textContent=NAV[p]?NAV[p][0]:'Overview';if(p==='home')return overview();if(p==='report')return reportPage();if(p==='settings')return settingsPage();return domainPage(p)}async function overview(){const c=$('content');c.innerHTML='<div class="empty">Membangun Quality Overview…</div>';try{const v=await Promise.all(['indicators','risks','incidents','clinical_pathways','oppe_evaluations','mortality_reviews','culture_survey_responses'].map(count));c.innerHTML='<section class="grid g4"><div class="card"><div class="label">Quality Evidence</div><div class="value">'+(v[0]+v[3]+v[4])+'</div><div class="sub">Indikator + CP + OPPE</div></div><div class="card"><div class="label">Patient Safety</div><div class="value">'+v[2]+'</div><div class="sub">IKP tersedia</div></div><div class="card"><div class="label">Risk Exposure</div><div class="value">'+v[1]+'</div><div class="sub">Risk Register</div></div><div class="card"><div class="label">Safety Culture</div><div class="value">'+v[6]+'</div><div class="sub">Respons survey</div></div></section><div class="section"><h2>Gambaran Besar Area Prioritas</h2><span class="pill">EVIDENCE INVENTORY</span></div><section class="grid g4">'+[['Audit Indikator Mutu',v[0]],['Audit Clinical Pathway',v[3]],['Audit Kematian',v[5]],['Audit OPPE',v[4]]].map(x=>'<div class="card"><div class="label">'+x[0]+'</div><div class="value">'+x[1]+'</div><div class="bar"><i style="width:'+Math.min(100,x[1]*5)+'%"></i></div></div>').join('')+'</section><div class="section"><h2>Capaian Pengisian vs Capaian Pekerjaan</h2><span class="pill">QUALITY OPERATIONS</span></div><section class="grid g2"><div class="card"><div class="label">Capaian Pengisian</div><div class="value">—</div><div class="sub">Engine siap membaca submission timestamp, periode, unit dan kelengkapan setelah CSV konten diunggah.</div></div><div class="card"><div class="label">Capaian Pekerjaan</div><div class="value">—</div><div class="sub">Engine siap membaca status, due date, completion dan effectiveness setelah field workflow tersedia.</div></div></section><div class="section"><h2>Work Queue</h2><span class="pill">EXECUTION LAYER</span></div><div class="card"><div class="queue"><i class="qdot"></i><div><b>Audit / corrective-action queue</b><div class="sub">Menunggu metadata status dan deadline dari dataset.</div></div><span class="tag">READY</span></div><div class="queue"><i class="qdot green"></i><div><b>Data submission performance</b><div class="sub">Unit pengirim tercepat akan dihitung dari timestamp submission.</div></div><span class="tag">READY</span></div></div><div class="section"><h2>IKU / IKI</h2><span class="pill">MANAGEMENT LAYER</span></div><div class="card"><div class="notice warn">KPI engine disiapkan tanpa memaksakan target/numerator/denominator sebelum konten CSV ditentukan.</div></div><div class="section"><h2>AI Quality Intelligence</h2><span class="pill">DECISION SUPPORT</span></div><div class="card ai"><b>✦ <strong>AI Analysis Layer</strong></b><p class="sub">Disiapkan untuk trend detection, outlier detection, synthesis akar masalah dan rekomendasi tindakan. Pada fase struktur ini AI tidak mengarang temuan dari data kosong.</p><div class="action"><span class="tag">Trend</span><span class="tag">Outlier</span><span class="tag">Root Cause</span><span class="tag">Action Recommendation</span></div></div>'}catch(e){c.innerHTML='<div class="notice bad"><b>Overview gagal dimuat.</b><br>'+esc(e.message||e)+'</div>'}}async function domainPage(p){const c=$('content'),items=DOMAINS[p],title=NAV[p][0];let cards='';items.forEach((x,i)=>cards+='<div class="card"><div class="label">'+esc(x[1])+'</div><div class="value" id="dc'+i+'">…</div><div class="sub">'+esc(x[0])+'</div><div style="margin-top:12px"><button class="btn secondary dataBtn" data-table="'+esc(x[0])+'" data-label="'+esc(x[1])+'">Buka Data</button></div></div>');let flow=p==='mutu'?'<span class="tag">Audit</span> → <span class="tag">Finding</span> → <span class="tag">PDSA</span> → <span class="tag">Re-audit</span>':p==='safety'?'<span class="tag">IKP</span> → <span class="tag">Grading</span> → <span class="tag">RCA</span> → <span class="tag">Corrective Action</span> → <span class="tag">Effectiveness</span>':'<span class="tag">Risk Register</span> → <span class="tag">Assessment</span> → <span class="tag">FMEA</span> → <span class="tag">Control</span> → <span class="tag">Residual Risk</span>';c.innerHTML='<div class="section" style="margin-top:0"><div><h2>'+title+'</h2><div class="sub">'+(p==='mutu'?'Measurement, clinical audit dan professional performance.':p==='safety'?'Incident reporting, RCA dan safety culture.':'Proactive risk identification, assessment dan FMEA.')+'</div></div><span class="pill">DOMAIN WORKSPACE</span></div><section class="grid '+(items.length>3?'g4':'g3')+'">'+cards+'</section><div class="section"><h2>Workflow</h2><span class="pill">INPUT → ANALYSIS → ACTION</span></div><div class="card"><div class="action">'+flow+'</div></div>';items.forEach(async(x,i)=>{try{$('dc'+i).textContent=await count(x[0])}catch{$('dc'+i).textContent='—'}});document.querySelectorAll('.dataBtn').forEach(b=>b.onclick=()=>dataTable(b.dataset.table,b.dataset.label))}async function dataTable(table,title){const c=$('content');c.innerHTML='<div class="empty">Memuat dataset sesuai RLS…</div>';try{let q=sb.from(table).select('*').limit(250);if(identity.unitId&&!admin()&&table!=='culture_survey_responses')q=q.eq('unit_id',identity.unitId);const r=await q;if(r.error)throw r.error;if(!r.data||!r.data.length){c.innerHTML='<div class="card"><h2>'+esc(title)+'</h2><div class="empty">Belum ada data pada scope akun ini.</div></div>';return}const keys=Object.keys(r.data[0]);let head=keys.map(k=>'<th>'+esc(k)+'</th>').join(''),body=r.data.map(row=>'<tr>'+keys.map(k=>'<td>'+esc(typeof row[k]==='object'?JSON.stringify(row[k]):row[k])+'</td>').join('')+'</tr>').join('');c.innerHTML='<div class="section" style="margin-top:0"><div><h2>'+esc(title)+'</h2><div class="sub">'+r.data.length+' record · RLS tetap menjadi security boundary.</div></div><button class="btn secondary" id="back">← Kembali</button></div><div class="toolbar"
